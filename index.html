<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soda Line</title>

  <style>
    :root {
      --ink: #e6d9c3;
      --dim: rgba(230, 217, 195, 0.36);
      --edge: rgba(230, 217, 195, 0.13);
      --amber: #f2a65a;
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body {
      -webkit-user-select: none;
      user-select: none;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink);
    }
    canvas { display: block; outline: none; touch-action: none; }

    /* Coin counter (top left) */
    #money {
      position: fixed;
      left: 22px;
      top: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #money.on { opacity: 1; }
    #money i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--amber);
      box-shadow: 0 0 6px rgba(242, 166, 90, 0.45);
    }

    /* Shop: a thin column of icon tiles (right edge) */
    #shop {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .tile {
      position: relative;
      width: 52px;
      height: 58px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: rgba(10, 9, 8, 0.78);
      cursor: default;
      transition: border-color 0.25s, background 0.25s;
      animation: tile-in 0.9s ease-out;
    }
    .tile[hidden] { display: none; }
    .tile svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--dim);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.25s;
    }
    .tile .c { font-size: 10px; color: var(--dim); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
    .tile .p { position: absolute; left: 6px; right: 6px; bottom: 4px; display: flex; gap: 1px; }
    .tile .p b { flex: 1; height: 2px; background: rgba(230, 217, 195, 0.12); }
    .tile .p b.f { background: rgba(242, 166, 90, 0.75); }
    .tile.ok { cursor: pointer; border-color: rgba(242, 166, 90, 0.34); }
    .tile.ok svg { stroke: var(--ink); }
    .tile.ok .c { color: var(--amber); }
    .tile.ok:hover { border-color: rgba(242, 166, 90, 0.7); background: rgba(34, 24, 14, 0.85); }
    .tile.max .c { visibility: hidden; }
    .tile.flash { animation: tile-buy 0.5s ease-out; }
    @keyframes tile-in { from { opacity: 0; transform: translateX(8px); } }
    @keyframes tile-buy { from { background: rgba(242, 166, 90, 0.35); } }

    /* Little "+12" that floats up where something sells */
    .pop {
      position: fixed;
      pointer-events: none;
      font-size: 11px;
      color: var(--amber);
      letter-spacing: 0.04em;
      text-shadow: 0 0 8px rgba(255, 140, 50, 0.45);
      transform: translate(-50%, -50%);
      animation: pop-rise 1.6s ease-out forwards;
    }
    @keyframes pop-rise {
      0% { opacity: 0; margin-top: 0; }
      15% { opacity: 1; }
      100% { opacity: 0; margin-top: -44px; }
    }

    /* Shown only if Three.js can't be loaded */
    #error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font: 13px/1.5 system-ui, sans-serif;
      color: #b9aa94;
    }
    #error[hidden] { display: none; }
  </style>

  <!-- Where "three" and its add-ons come from (a CDN). No build step needed. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="money"><i></i><span>0</span></div>
  <div id="shop"></div>
  <div id="error" hidden></div>

  <script>
    // If the scene hasn't started after a few seconds, explain why.
    setTimeout(function () {
      if (!window.__dioramaStarted) {
        var el = document.getElementById('error');
        el.textContent = 'Needs an internet connection (to load Three.js) and a browser with WebGL.';
        el.hidden = false;
      }
    }, 9000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    /* =====================================================================
       0. SMALL HELPERS
       ===================================================================== */

    const deg = THREE.MathUtils.degToRad;
    const lerp = THREE.MathUtils.lerp;
    const clamp = THREE.MathUtils.clamp;
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const rand = (a, b) => a + Math.random() * (b - a);

    // Easing curves: take 0..1, return a smoothed 0..1 (no instant snaps).
    const Ease = {
      inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
      outCubic: (t) => 1 - Math.pow(1 - t, 3),
      inQuad: (t) => t * t,
      outBack: (t) => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
      outBounce: (t) => {
        const n = 7.5625, d = 2.75;
        if (t < 1 / d) return n * t * t;
        if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
        if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
        return n * (t -= 2.625 / d) * t + 0.984375;
      },
    };

    // Moves `current` smoothly toward `target`, the same at any frame rate.
    function damp(current, target, speed, dt) {
      return lerp(current, target, 1 - Math.exp(-speed * dt));
    }

    // Short number format: 4.5, 12, 1.24k, 34.0M ...
    function fmt(n) {
      if (n < 10) return (Math.round(n * 10) / 10).toString();
      if (n < 1000) return Math.floor(n).toString();
      const units = ['k', 'M', 'B', 'T', 'q', 'Q'];
      let u = -1;
      while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
      return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + units[u];
    }

    /* =====================================================================
       1. LAYOUT, ECONOMY AND SAVE DATA
       ===================================================================== */

    const BAY = 2.6;                          // distance between stations along the belt
    const BELT = { y: 1.0, width: 1.0, rollerRadius: 0.18, thickness: 0.025, tile: BAY / 8 };
    const SURFACE = BELT.y + BELT.rollerRadius + BELT.thickness; // height where cans stand
    const CAN = { radius: 0.23, height: 0.8, levelMin: 0.1, levelMax: 0.62 };
    const CAN_TOP = SURFACE + CAN.height;
    const SPACING = 0.6;                      // closest two cans can be on the belt
    const START_X = -BAY / 2;                 // the first roller
    const bayX = (i) => i * BAY;              // x position of station i
    const SUPPORT_DEPTH = 80;                 // supports run this far down (much further than you can see)

    // Stations in order along the belt. Drop and Fill are there from the start.
    const ST = { DROP: 0, FILL: 1, CAP: 2, LABEL: 3, STAMP: 4 };

    // Shop items. Items with `max` have levels; the rest are bought once.
    // `after` = only offered once that other item is owned.
    const SHOP = [
      { id: 'syrup', icon: 'drop', cost: 5, grow: 1.6, max: 12 },
      { id: 'motor', icon: 'gear', cost: 8, grow: 1.75, max: 8 },
      { id: 'nozzle', icon: 'tap', cost: 12, grow: 1.8, max: 8 },
      { id: 'alloy', icon: 'can', cost: 60, grow: 2.0, max: 10 },
      { id: 'art', icon: 'wave', cost: 220, grow: 1.85, max: 10, after: 'label' },
      { id: 'cap', icon: 'press', cost: 25, station: ST.CAP },
      { id: 'label', icon: 'label', cost: 150, station: ST.LABEL, after: 'cap' },
      { id: 'stamp', icon: 'stamp', cost: 900, station: ST.STAMP, after: 'label' },
      { id: 'crate', icon: 'six', cost: 5000, after: 'stamp' },
    ];
    const ONE_TIME = new Set(['cap', 'label', 'stamp', 'crate']);

    // Everything that gets saved
    const game = {
      money: 0,
      lv: { syrup: 0, motor: 0, nozzle: 0, alloy: 0, art: 0 },
      own: { cap: false, label: false, stamp: false, crate: false },
      seen: {},
    };

    const itemCost = (item) => (item.max ? item.cost * Math.pow(item.grow, game.lv[item.id]) : item.cost);
    const bayCount = () => (game.own.stamp ? 5 : game.own.label ? 4 : game.own.cap ? 3 : 2);
    const endX = () => bayX(bayCount() - 1) + BAY / 2;           // where the belt ends
    const pourRate = () => 0.3 * (1 + 0.3 * game.lv.nozzle);      // fill per second
    const indexTime = () => 1.6 / (1 + 0.22 * game.lv.motor);    // seconds to move one station
    const labelRate = () => 0.6;                                   // wraps per second

    // How well the can was filled: just right is best, spilling is bad
    function fillFactor(c) {
      if (c.maxFill > 1.03) return 0.5;
      if (c.fill >= 0.9) return 1.5;
      if (c.fill >= 0.7) return 1;
      return c.fill;
    }

    // What one finished can is worth
    function canValue(c) {
      let v = Math.pow(1.25, game.lv.syrup) * Math.pow(1.35, game.lv.alloy) * fillFactor(c);
      if (c.capped) v *= 2.5;
      if (c.labeled) v *= 3 * Math.pow(1.3, game.lv.art);
      if (c.stamped) v *= 2.5;
      return v;
    }

    const SAVE_KEY = 'soda-line-save-1';
    function saveGame() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); } catch (e) { /* storage unavailable */ }
    }
    function loadGame() {
      try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (!data) return;
        if (Number.isFinite(data.money)) game.money = Math.max(0, data.money);
        for (const item of SHOP) {
          const n = data.lv && data.lv[item.id];
          if (item.max && Number.isFinite(n)) game.lv[item.id] = clamp(Math.floor(n), 0, item.max);
        }
        for (const k in game.own) if (data.own && typeof data.own[k] === 'boolean') game.own[k] = data.own[k];
        if (data.seen && typeof data.seen === 'object') Object.assign(game.seen, data.seen);
      } catch (e) { /* ignore a broken save */ }
    }

    /* =====================================================================
       2. RENDERER, SCENE, CAMERA, BLOOM
       ===================================================================== */

    // Camera: a 3/4 view tilted down ~32 degrees, with a long lens.
    const VIEW = {
      fov: 24,
      polar: deg(57.5),          // 90 - 57.5 = 32.5 degrees downward tilt
      azimuth: deg(-30),         // from the front-left
      minDist: 3.8,              // closest zoom
      maxDist: 34,               // furthest zoom
      startDist: 26,
      orbitSide: deg(28),
      orbitUp: deg(7),
    };
    const FOG_DENSITY = 0.011;
    const FOG_REF = 29;          // fog is tuned for this camera distance

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    const pixelRatio = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.localClippingEnabled = true; // keeps the liquid surface level
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, FOG_DENSITY);

    const camera = new THREE.PerspectiveCamera(VIEW.fov, window.innerWidth / window.innerHeight, 0.3, 200);

    // HDR + anti-aliased render target, then bloom, then tone mapping
    const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
    composer.setPixelRatio(pixelRatio);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.6, 0.9));
    composer.addPass(new OutputPass());
    composer.setSize(window.innerWidth, window.innerHeight);

    // Reflections: a tiny dark studio (one warm soft-box, one cool strip) for metals to reflect
    function buildEnvironmentMap() {
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(
        new THREE.BoxGeometry(20, 20, 20),
        new THREE.MeshBasicMaterial({ color: 0x030303, side: THREE.BackSide })
      ));
      const panel = (w, h, color, strength, position) => {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(strength), side: THREE.DoubleSide })
        );
        mesh.position.copy(position);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      };
      panel(5, 5, 0xffd2a0, 3.0, new THREE.Vector3(2.5, 8.5, 4.5));
      panel(9, 1.2, 0x9cbcff, 1.2, new THREE.Vector3(5, 3.5, -8));
      const pmrem = new THREE.PMREMGenerator(renderer);
      const texture = pmrem.fromScene(envScene, 0.04).texture;
      pmrem.dispose();
      return texture;
    }
    scene.environment = buildEnvironmentMap();

    /* =====================================================================
       3. LIGHTS
       The spotlight follows the camera as you pan along the line.
       ===================================================================== */

    scene.add(new THREE.HemisphereLight(0x7d8fa8, 0x15100b, 0.1));

    const keyLight = new THREE.SpotLight(0xffc690, 340, 0, deg(30), 0.6, 2);
    keyLight.position.set(2.4, 9.6, 4.4);
    keyLight.target.position.set(0, 1.5, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 4;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.0003;
    keyLight.shadow.normalBias = 0.02;
    scene.add(keyLight, keyLight.target);
    const KEY_OFFSET = keyLight.position.clone().sub(keyLight.target.position);
    const KEY_DIR = KEY_OFFSET.clone().negate().normalize();

    const rimLight = new THREE.SpotLight(0x8fb4ff, 50, 0, deg(40), 1.0, 2);
    rimLight.position.set(4.5, 5.5, -7.5);
    rimLight.target.position.set(0, 1.4, 0);
    scene.add(rimLight, rimLight.target);
    const RIM_OFFSET = rimLight.position.clone().sub(rimLight.target.position);

    /* =====================================================================
       4. TEXTURES (drawn on a 2D canvas, so no image files) AND MATERIALS
       ===================================================================== */

    function makeCanvas(w, h) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      return [canvas, canvas.getContext('2d')];
    }

    function toTexture(canvas, isColor = true) {
      const texture = new THREE.CanvasTexture(canvas);
      if (isColor) texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function addGrain(g, w, h, amount) {
      const img = g.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * amount;
        d[i] += n; d[i + 1] += n; d[i + 2] += n;
      }
      g.putImageData(img, 0, 0);
    }

    // Grime and chipped paint for painted steel
    function makeGrimeTexture() {
      const S = 256;
      const [c, g] = makeCanvas(S, S);
      g.fillStyle = '#dadada';
      g.fillRect(0, 0, S, S);
      for (let i = 0; i < 70; i++) {
        const x = rand(0, S), y = rand(0, S), r = rand(5, 50);
        const grd = g.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, 'rgba(40,30,20,0.18)');
        grd.addColorStop(1, 'rgba(40,30,20,0)');
        g.fillStyle = grd;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      for (let i = 0; i < 45; i++) {
        const x = rand(0, S), y = rand(0, S), l = rand(20, 90);
        const grd = g.createLinearGradient(x, y, x, y + l);
        grd.addColorStop(0, 'rgba(70,40,20,0.28)');
        grd.addColorStop(1, 'rgba(70,40,20,0)');
        g.fillStyle = grd;
        g.fillRect(x, y, rand(1, 3), l);
      }
      for (let i = 0; i < 140; i++) {
        g.fillStyle = `rgba(255,255,255,${rand(0.15, 0.35)})`;
        g.fillRect(rand(0, S), rand(0, S), rand(1, 4), rand(1, 3));
      }
      addGrain(g, S, S, 16);
      return toTexture(c);
    }

    // Fine streaks for brushed metal (used as a roughness map)
    function makeBrushedTexture() {
      const S = 256;
      const [c, g] = makeCanvas(S, S);
      g.fillStyle = '#8c8c8c';
      g.fillRect(0, 0, S, S);
      for (let i = 0; i < 1800; i++) {
        const v = Math.floor(rand(100, 220));
        g.fillStyle = `rgba(${v},${v},${v},0.22)`;
        g.fillRect(rand(0, S), rand(0, S), rand(20, 160), 1);
      }
      return toTexture(c, false);
    }

    // Ribbed rubber for the belt (repeats, and scrolls when the belt moves)
    function makeBeltTexture() {
      const W = 128, H = 64;
      const [c, g] = makeCanvas(W, H);
      g.fillStyle = '#1d1d1d';
      g.fillRect(0, 0, W, H);
      for (let i = 0; i < 4; i++) {
        const x = i * 32 + 8;
        g.fillStyle = '#343434';
        g.fillRect(x, 0, 5, H);
        g.fillStyle = '#090909';
        g.fillRect(x + 5, 0, 3, H);
      }
      addGrain(g, W, H, 18);
      return toTexture(c);
    }

    // The label: deep red, a cream wave and a small wordmark
    function makeLabelTexture() {
      const W = 512, H = 224;
      const [c, g] = makeCanvas(W, H);
      const grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#8a1118');
      grd.addColorStop(0.5, '#c4232c');
      grd.addColorStop(1, '#8a1118');
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
      g.fillStyle = '#efe3cc';
      g.beginPath();
      for (let x = 0; x <= W; x += 4) {
        const y = H * 0.6 + Math.sin((x / W) * Math.PI * 4) * 13;
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      for (let x = W; x >= 0; x -= 4) g.lineTo(x, H * 0.6 + 17 + Math.sin((x / W) * Math.PI * 4 + 0.6) * 13);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(30,5,5,0.55)';
      g.fillRect(0, 9, W, 3);
      g.fillRect(0, H - 12, W, 3);
      g.fillStyle = 'rgba(255,240,220,0.8)';
      g.fillRect(0, 15, W, 1.5);
      g.fillRect(0, H - 17, W, 1.5);
      // Wordmark twice around. These spots end up facing the camera once the label is wrapped on.
      g.font = 'italic 900 58px Georgia, "Times New Roman", serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = '#f7efe0';
      for (const x of [W * 0.42, W * 0.92]) {
        for (const dx of [-W, 0, W]) g.fillText('Fizz', x + dx, H * 0.36);
      }
      for (let i = 0; i < 46; i++) {
        g.fillStyle = `rgba(255,235,220,${rand(0.15, 0.4)})`;
        g.beginPath();
        g.arc(rand(0, W), rand(H * 0.75, H * 0.9), rand(1, 3.2), 0, Math.PI * 2);
        g.fill();
      }
      addGrain(g, W, H, 8);
      return toTexture(c);
    }

    // Streaks that scroll down the pouring stream
    function makeStreamTexture() {
      const W = 64, H = 256;
      const [c, g] = makeCanvas(W, H);
      g.fillStyle = '#e8e8e8';
      g.fillRect(0, 0, W, H);
      for (let i = 0; i < 60; i++) {
        g.fillStyle = Math.random() < 0.5
          ? `rgba(255,240,215,${rand(0.15, 0.4)})`
          : `rgba(70,25,5,${rand(0.05, 0.35)})`;
        g.fillRect(rand(0, W), 0, rand(1, 5), H);
      }
      for (let i = 0; i < 16; i++) {
        g.fillStyle = `rgba(255,245,225,${rand(0.08, 0.2)})`;
        g.fillRect(0, rand(0, H), W, rand(2, 7));
      }
      return toTexture(c);
    }

    // The liquid surface from above: dark soda in the middle, foam at the edge
    function makeFoamTexture() {
      const S = 128;
      const [c, g] = makeCanvas(S, S);
      const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      grd.addColorStop(0, '#3e1606');
      grd.addColorStop(0.6, '#5c240b');
      grd.addColorStop(0.84, '#8a4a22');
      grd.addColorStop(0.95, '#c9a37a');
      grd.addColorStop(1, '#dcc4a0');
      g.fillStyle = grd;
      g.fillRect(0, 0, S, S);
      for (let i = 0; i < 170; i++) {
        const a = rand(0, Math.PI * 2), r = rand(0.72, 0.98) * (S / 2);
        g.fillStyle = `rgba(230,205,170,${rand(0.15, 0.4)})`;
        g.beginPath();
        g.arc(S / 2 + Math.cos(a) * r, S / 2 + Math.sin(a) * r, rand(0.6, 2.2), 0, Math.PI * 2);
        g.fill();
      }
      return toTexture(c);
    }

    // A soft round dot (for splashes)
    function makeDotTexture() {
      const S = 64;
      const [c, g] = makeCanvas(S, S);
      const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.5, 'rgba(255,255,255,0.6)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, S, S);
      return toTexture(c);
    }

    const TEX = {
      grime: makeGrimeTexture(),
      brushed: makeBrushedTexture(),
      belt: makeBeltTexture(),
      label: makeLabelTexture(),
      stream: makeStreamTexture(),
      foam: makeFoamTexture(),
      dot: makeDotTexture(),
    };
    TEX.belt.repeat.set(BAY / BELT.tile, 1);
    TEX.brushed.repeat.set(2, 2);

    // roughness: 0 = mirror .. 1 = matte, metalness: 0 = paint/plastic .. 1 = metal
    const MAT = {
      paint: new THREE.MeshStandardMaterial({ color: 0x52625b, map: TEX.grime, roughness: 0.62, metalness: 0.35 }),
      accent: new THREE.MeshStandardMaterial({ color: 0xb5832a, map: TEX.grime, roughness: 0.55, metalness: 0.3 }),
      brushed: new THREE.MeshStandardMaterial({ color: 0xa4a7ab, roughnessMap: TEX.brushed, roughness: 0.75, metalness: 0.9 }),
      darkSteel: new THREE.MeshStandardMaterial({ color: 0x2b2c2e, roughness: 0.48, metalness: 0.85 }),
      chrome: new THREE.MeshStandardMaterial({ color: 0xdde2e6, roughness: 0.16, metalness: 1.0 }),
      guide: new THREE.MeshStandardMaterial({ color: 0x8d9298, roughness: 0.38, metalness: 1.0 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xb89058, roughness: 0.32, metalness: 1.0 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.88, metalness: 0.0 }),
      grip: new THREE.MeshStandardMaterial({ color: 0x161412, roughness: 0.7, metalness: 0.0 }),
      belt: new THREE.MeshStandardMaterial({ map: TEX.belt, bumpMap: TEX.belt, bumpScale: 0.8, roughness: 0.86, metalness: 0.0 }),
      hole: new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1, metalness: 0 }),
      red: new THREE.MeshStandardMaterial({ color: 0x8e1c14, roughness: 0.38, metalness: 0.1 }),
      crate: new THREE.MeshStandardMaterial({ color: 0x5c4630, map: TEX.grime, roughness: 0.8, metalness: 0.05, transparent: true }),
      staticAlu: new THREE.MeshStandardMaterial({ color: 0xc9ced3, roughness: 0.3, metalness: 1.0, side: THREE.DoubleSide }),
      labelRoll: new THREE.MeshStandardMaterial({ map: TEX.label, roughness: 0.45, metalness: 0.3 }),

      // Can materials: every can gets its own copies so it can fade by itself
      canAlu: new THREE.MeshStandardMaterial({ color: 0xc9ced3, roughness: 0.28, metalness: 1.0, transparent: true, side: THREE.DoubleSide }),
      canBody: new THREE.MeshStandardMaterial({ color: 0xc9ced3, roughness: 0.28, metalness: 1.0, transparent: true }),
      canLid: new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.55, metalness: 0.9, transparent: true }),
      canLabel: new THREE.MeshStandardMaterial({ map: TEX.label, roughness: 0.32, metalness: 0.5, transparent: true }),
      canInner: new THREE.MeshStandardMaterial({ color: 0x80848a, roughness: 0.5, metalness: 1.0, transparent: true, side: THREE.BackSide }),
      ink: new THREE.MeshStandardMaterial({ color: 0x4a0a0a, roughness: 0.9, metalness: 0, transparent: true, polygonOffset: true, polygonOffsetFactor: -2 }),
      liquid: new THREE.MeshStandardMaterial({ color: 0x7a3a12, roughness: 0.45, metalness: 0.0, emissive: 0x301204 }),
      liquidSurface: new THREE.MeshStandardMaterial({ map: TEX.foam, roughness: 0.3, metalness: 0.0, emissive: 0x120601 }),

      stream: new THREE.MeshStandardMaterial({
        color: 0xa24a18, map: TEX.stream, roughness: 0.1, metalness: 0.0, emissive: 0x2e0e03,
        transparent: true, opacity: 0.82, depthWrite: false,
      }),
    };

    // One-line mesh helper
    function addMesh(geometry, material, parent, { x = 0, y = 0, z = 0, cast = true, receive = true } = {}) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    // Makes a material fade to black lower down. Used on the supports that
    // run down into the void "forever" (they're very long and just disappear).
    function withDepthFade(material, fadeTop, fadeBottom) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uFadeTop = { value: fadeTop };
        shader.uniforms.uFadeBottom = { value: fadeBottom };
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying float vWorldY;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWorldY = (modelMatrix * vec4(transformed, 1.0)).y;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying float vWorldY;\nuniform float uFadeTop;\nuniform float uFadeBottom;')
          .replace('#include <dithering_fragment>', '#include <dithering_fragment>\ngl_FragColor.rgb *= smoothstep(uFadeBottom, uFadeTop, vWorldY);');
      };
      return material;
    }
    const fadingPaint = withDepthFade(MAT.paint.clone(), 0.7, -6.5);

    // Invisible shapes you can click (bigger than the real parts, so they're easy to hit)
    const HIT_MAT = new THREE.MeshBasicMaterial({ visible: false });
    function makeHit(geometry, parent, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(geometry, HIT_MAT);
      mesh.position.set(x, y, z);
      parent.add(mesh);
      return mesh;
    }

    /* =====================================================================
       5. CAN SHAPES (shared by every can). Heights measured from the base.
       ===================================================================== */

    const CAN_GEO = (() => {
      const r = CAN.radius;
      return {
        bottomRing: new THREE.CylinderGeometry(r, 0.175, 0.06, 40, 1, true).translate(0, 0.03, 0),
        bottomCap: new THREE.CircleGeometry(0.175, 32).rotateX(Math.PI / 2).translate(0, 0.003, 0),
        body: new THREE.CylinderGeometry(r, r, 0.62, 48, 1, true).translate(0, 0.37, 0),
        // The label is a slightly bigger tube; it's revealed one slice at a time as it wraps on.
        // Turned half a turn so the first slice starts at the back, where the label roll touches.
        labelBand: new THREE.CylinderGeometry(r + 0.003, r + 0.003, 0.56, 48, 1, true).translate(0, 0.37, 0).rotateY(Math.PI),
        shoulder: new THREE.CylinderGeometry(0.185, r, 0.09, 48, 1, true).translate(0, 0.725, 0),
        neck: new THREE.CylinderGeometry(0.185, 0.185, 0.03, 48, 1, true).translate(0, 0.785, 0),
        rim: new THREE.TorusGeometry(0.185, 0.011, 8, 48).rotateX(Math.PI / 2).translate(0, 0.8, 0),
        inner: new THREE.CylinderGeometry(0.219, 0.219, 0.62, 32, 1, true).translate(0, 0.37, 0),
        innerBottom: new THREE.CircleGeometry(0.219, 32).rotateX(Math.PI / 2).translate(0, 0.065, 0),
        liquid: new THREE.CylinderGeometry(0.213, 0.213, 0.6, 32).translate(0, 0.37, 0),
        surface: new THREE.CircleGeometry(0.213, 40).rotateX(-Math.PI / 2),
        lid: new THREE.CylinderGeometry(0.19, 0.19, 0.016, 40).translate(0, 0.008, 0),
        lidRing: new THREE.TorusGeometry(0.168, 0.007, 6, 40).rotateX(Math.PI / 2).translate(0, 0.017, 0),
        tab: new RoundedBoxGeometry(0.11, 0.008, 0.055, 2, 0.003).translate(0.035, 0.021, 0),
        rivet: new THREE.CylinderGeometry(0.012, 0.012, 0.01, 12).translate(0, 0.02, 0),
        mark: new THREE.PlaneGeometry(0.1, 0.05).rotateX(-Math.PI / 2),
      };
    })();
    const LABEL_SLICES = 48;

    function makeLidMesh(material) {
      const g = new THREE.Group();
      for (const geo of [CAN_GEO.lid, CAN_GEO.lidRing, CAN_GEO.tab, CAN_GEO.rivet]) addMesh(geo, material, g);
      return g;
    }

    // A plain decorative can (the spares waiting in the magazine)
    function makeStaticCan() {
      const g = new THREE.Group();
      const parts = [CAN_GEO.bottomRing, CAN_GEO.bottomCap, CAN_GEO.body, CAN_GEO.shoulder, CAN_GEO.neck, CAN_GEO.rim];
      for (const geo of parts) addMesh(geo, MAT.staticAlu, g);
      return g;
    }

    /* =====================================================================
       6. THE LINE: belt sections, rollers and supports
       One belt section per station. Buying a station adds a section, which
       rises out of the dark, and the end roller slides along to the new end.
       ===================================================================== */

    const R = BELT.rollerRadius, T = BELT.thickness, W = BELT.width;
    const GUIDE_Y = SURFACE + 0.32;           // height of the thin guide bars
    const GUIDE_Z = CAN.radius + 0.1;
    const RAIL_TOP = BELT.y + 0.16;

    function halfTube(thetaStart) {
      return new THREE.CylinderGeometry(R + T, R + T, W, 28, 1, true, thetaStart, Math.PI).rotateX(Math.PI / 2);
    }

    const GEO = {
      beltRun: new THREE.BoxGeometry(BAY, T, W),
      rail: new THREE.BoxGeometry(BAY, 0.36, 0.04),
      railStub: new THREE.BoxGeometry(0.34, 0.36, 0.04),
      guide: new THREE.CylinderGeometry(0.012, 0.012, BAY, 8).rotateZ(Math.PI / 2),
      guidePost: new THREE.BoxGeometry(0.03, GUIDE_Y - RAIL_TOP + 0.02, 0.03),
      guideArm: new THREE.BoxGeometry(0.025, 0.025, 0.58 - GUIDE_Z),
      leg: new THREE.BoxGeometry(0.08, SUPPORT_DEPTH, 0.08),
      brace: new THREE.BoxGeometry(0.05, 0.05, 1.16),
      wrapStart: halfTube(Math.PI),
      wrapEnd: halfTube(0),
      drum: new THREE.CylinderGeometry(R, R, W + 0.04, 32).rotateX(Math.PI / 2),
      axle: new THREE.CylinderGeometry(0.035, 0.035, W + 0.36, 12).rotateX(Math.PI / 2),
      hub: new THREE.CylinderGeometry(0.1, 0.1, 0.04, 6).rotateX(Math.PI / 2),
      hubArm: new THREE.BoxGeometry(0.17, 0.035, 0.015),
      gusset: new THREE.BoxGeometry(0.06, 0.06, 0.42),
    };

    const line = new THREE.Group();
    scene.add(line);
    const rollers = [];   // spin when the belt moves
    const segments = [];  // belt section for each station

    // A pair of legs running down into the dark, with cross braces
    function addLegs(parent, x) {
      const top = BELT.y - 0.2;
      for (const side of [-1, 1]) addMesh(GEO.leg, fadingPaint, parent, { x, y: top - SUPPORT_DEPTH / 2, z: side * 0.58 });
      for (let y = top - 0.9; y > -10; y -= 2.4) addMesh(GEO.brace, fadingPaint, parent, { x, y });
    }

    function buildSegment(i) {
      const g = new THREE.Group();
      const x = bayX(i);
      addMesh(GEO.beltRun, MAT.belt, g, { x, y: BELT.y + R + T / 2 });           // top of the belt
      addMesh(GEO.beltRun, MAT.rubber, g, { x, y: BELT.y - R - T / 2 });         // return underneath
      for (const side of [-1, 1]) {
        addMesh(GEO.rail, MAT.paint, g, { x, y: BELT.y - 0.02, z: side * 0.58 });
        if (side < 0 && i === ST.LABEL) continue; // the label roll sits behind the belt here
        addMesh(GEO.guide, MAT.guide, g, { x, y: GUIDE_Y, z: side * GUIDE_Z });
        const px = x - BAY / 2 + 0.3;
        addMesh(GEO.guidePost, MAT.darkSteel, g, { x: px, y: (GUIDE_Y + RAIL_TOP) / 2, z: side * 0.58 });
        addMesh(GEO.guideArm, MAT.darkSteel, g, { x: px, y: GUIDE_Y, z: side * (GUIDE_Z + (0.58 - GUIDE_Z) / 2) });
      }
      addLegs(g, x - BAY / 2 + 0.5);
      line.add(g);
      return g;
    }

    function makeRoller(parent, x) {
      const roller = new THREE.Group();
      roller.position.set(x, BELT.y, 0);
      addMesh(GEO.drum, MAT.brushed, roller);
      addMesh(GEO.axle, MAT.chrome, roller);
      for (const side of [-1, 1]) {
        addMesh(GEO.hub, MAT.darkSteel, roller, { z: side * (W / 2 + 0.13) });
        addMesh(GEO.hubArm, MAT.accent, roller, { z: side * (W / 2 + 0.157) });
      }
      parent.add(roller);
      rollers.push(roller);
      return roller;
    }

    // Start of the line: roller, belt wrap and the motor
    const startCap = new THREE.Group();
    line.add(startCap);
    {
      addMesh(GEO.wrapStart, MAT.rubber, startCap, { x: START_X, y: BELT.y });
      makeRoller(startCap, START_X);
      for (const side of [-1, 1]) addMesh(GEO.railStub, MAT.paint, startCap, { x: START_X - 0.12, y: BELT.y - 0.02, z: side * 0.58 });
      const motor = new THREE.Group();
      motor.position.set(START_X, BELT.y - 0.02, -0.92);
      addMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.44, 28).rotateX(Math.PI / 2), MAT.paint, motor);
      addMesh(new THREE.CylinderGeometry(0.21, 0.21, 0.04, 28).rotateX(Math.PI / 2), MAT.darkSteel, motor, { z: -0.23 });
      const finGeo = new THREE.BoxGeometry(0.44, 0.02, 0.36);
      for (let i = 0; i < 6; i++) {
        const fin = addMesh(finGeo, MAT.paint, motor);
        fin.rotation.z = (i / 6) * Math.PI;
      }
      addMesh(new RoundedBoxGeometry(0.2, 0.12, 0.16, 2, 0.02), MAT.darkSteel, motor, { y: 0.22 });
      startCap.add(motor);
    }

    // End of the line: roller and belt wrap. This group slides when the line grows.
    const endCap = new THREE.Group();
    line.add(endCap);
    addMesh(GEO.wrapEnd, MAT.rubber, endCap, { y: BELT.y });
    makeRoller(endCap, 0);
    for (const side of [-1, 1]) addMesh(GEO.railStub, MAT.paint, endCap, { x: 0.12, y: BELT.y - 0.02, z: side * 0.58 });
    let endCapTarget = 0;

    // New parts rise up out of the dark
    const risers = [];
    function riseUp(obj, delay = 0, baseY = 0) {
      obj.visible = true;
      obj.position.y = baseY - 6;
      risers.push({ obj, t: -delay, baseY });
    }
    function updateRisers(dt) {
      for (let i = risers.length - 1; i >= 0; i--) {
        const r = risers[i];
        r.t += dt;
        const k = clamp01(r.t / 1.8);
        r.obj.position.y = r.baseY - 6 * (1 - Ease.outCubic(k));
        if (k >= 1) risers.splice(i, 1);
      }
    }

    /* =====================================================================
       7. STATIONS
       Each builder returns { group, ...the parts that move or can be clicked }.
       ===================================================================== */

    // A support column behind the belt (running down into the dark) and an arm over the belt
    function addColumnAndArm(group, x, armY, armEndZ) {
      const top = armY + 0.09;
      addMesh(new THREE.BoxGeometry(0.24, top + SUPPORT_DEPTH, 0.24), fadingPaint, group, { x, y: (top - SUPPORT_DEPTH) / 2, z: -1.0 });
      const len = armEndZ + 1.06;
      addMesh(new THREE.BoxGeometry(0.2, 0.18, len), MAT.paint, group, { x, y: armY, z: -1.06 + len / 2 });
      const gusset = addMesh(GEO.gusset, MAT.paint, group, { x, y: armY - 0.18, z: -0.78 });
      gusset.rotation.x = deg(-45);
    }

    // --- 7a. DROP: a magazine of empty cans, its pull chain, and the belt's push button
    const MAG_BOTTOM = CAN_TOP + 0.2;                           // cans drop from here
    const CHAIN_TOP = new THREE.Vector3(bayX(ST.DROP) + 0.62, 2.95, 0.92);
    let runButton, runButtonBaseY, runLampMat, powerLedMat;

    function buildDispenser() {
      const g = new THREE.Group();
      const x = bayX(ST.DROP);
      const magH = 1.75;
      addColumnAndArm(g, x, MAG_BOTTOM + 1.25, -0.27);
      const rodGeo = new THREE.CylinderGeometry(0.014, 0.014, magH, 8);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        addMesh(rodGeo, MAT.chrome, g, { x: x + sx * 0.27, y: MAG_BOTTOM + magH / 2, z: sz * 0.27 });
      }
      const ringGeo = new THREE.TorusGeometry(0.382, 0.018, 6, 4).rotateX(Math.PI / 2).rotateY(Math.PI / 4); // square ring
      for (const y of [MAG_BOTTOM, MAG_BOTTOM + magH * 0.55, MAG_BOTTOM + magH]) addMesh(ringGeo, MAT.darkSteel, g, { x, y });
      for (const y of [MAG_BOTTOM + 0.04, MAG_BOTTOM + 0.88]) {
        const spare = makeStaticCan();
        spare.position.set(x, y, 0);
        g.add(spare);
      }

      // Switch box the chain hangs from, on a bracket off the magazine
      const box = CHAIN_TOP.clone().add(new THREE.Vector3(0, 0.1, 0));
      addMesh(new RoundedBoxGeometry(0.18, 0.2, 0.18, 2, 0.025), MAT.paint, g, { x: box.x, y: box.y, z: box.z });
      addMesh(new THREE.TorusGeometry(0.022, 0.008, 6, 16).rotateX(Math.PI / 2), MAT.darkSteel, g, { x: CHAIN_TOP.x, y: CHAIN_TOP.y, z: CHAIN_TOP.z });
      powerLedMat = new THREE.MeshStandardMaterial({ color: 0x0b2a12, emissive: 0x4dff7a, emissiveIntensity: 2.2 });
      addMesh(new THREE.SphereGeometry(0.014, 12, 8), powerLedMat, g, { x: box.x, y: box.y + 0.05, z: box.z + 0.092, cast: false });
      const from = new THREE.Vector3(x + 0.27, box.y, 0.27);
      const bracket = addMesh(new THREE.BoxGeometry(0.05, 0.05, from.distanceTo(box)), MAT.darkSteel, g);
      bracket.position.copy(from).lerp(box, 0.5);
      bracket.lookAt(box);

      // Control box with the push button that moves the belt one station
      const cb = new THREE.Vector3(x - 0.78, SURFACE - 0.02, 0.9);
      addMesh(new RoundedBoxGeometry(0.34, 0.2, 0.28, 2, 0.03), MAT.paint, g, { x: cb.x, y: cb.y, z: cb.z });
      addMesh(new THREE.BoxGeometry(0.05, 0.05, 0.3), MAT.darkSteel, g, { x: cb.x, y: cb.y - 0.05, z: 0.74 });
      addMesh(new THREE.BoxGeometry(0.05, SUPPORT_DEPTH, 0.05), fadingPaint, g, { x: cb.x, y: cb.y - 0.1 - SUPPORT_DEPTH / 2, z: cb.z });
      addMesh(new THREE.CylinderGeometry(0.078, 0.082, 0.03, 24), MAT.darkSteel, g, { x: cb.x - 0.04, y: cb.y + 0.115, z: cb.z });
      runButton = new THREE.Group();
      runButtonBaseY = cb.y + 0.13;
      runButton.position.set(cb.x - 0.04, runButtonBaseY, cb.z);
      addMesh(new THREE.CylinderGeometry(0.064, 0.064, 0.045, 24).translate(0, 0.0225, 0), MAT.red, runButton);
      g.add(runButton);
      runLampMat = new THREE.MeshStandardMaterial({ color: 0x1a2a10, emissive: 0x9dff6a, emissiveIntensity: 0.05, roughness: 0.3 });
      addMesh(new THREE.SphereGeometry(0.022, 12, 8), runLampMat, g, { x: cb.x + 0.11, y: cb.y + 0.11, z: cb.z - 0.06, cast: false });
      const runHit = makeHit(new THREE.SphereGeometry(0.18, 10, 8), g, cb.x - 0.04, cb.y + 0.15, cb.z);

      line.add(g);
      return { group: g, runHit };
    }

    // --- 7b. FILL: housing, nozzle, lamp, and the valve lever you hold to pour
    const FILL = (() => {
      const x = bayX(ST.FILL);
      const nozzleLength = 0.24;
      const tipY = CAN_TOP + 0.3;
      const housingBottom = tipY + nozzleLength;
      const hs = new THREE.Vector3(0.66, 0.5, 0.58);
      const hc = new THREE.Vector3(x, housingBottom + hs.y / 2, 0);
      return { x, nozzleLength, tipY, housingBottom, hs, hc, armY: housingBottom + hs.y + 0.09 };
    })();
    let nozzleSpout, fillLampMat, fillLampLight, valveLever;

    function buildFiller() {
      const g = new THREE.Group();
      const { x, hs, hc, housingBottom, nozzleLength, armY } = FILL;
      addColumnAndArm(g, x, armY, 0.16);

      addMesh(new RoundedBoxGeometry(hs.x, hs.y, hs.z, 3, 0.04), MAT.paint, g, { x: hc.x, y: hc.y, z: hc.z });
      const front = hc.z + hs.z / 2;
      addMesh(new THREE.BoxGeometry(0.24, 0.07, 0.008), MAT.accent, g, { x: x + 0.12, y: hc.y + 0.11, z: front + 0.004 });
      const ventGeo = new THREE.BoxGeometry(0.34, 0.012, 0.008);
      for (let i = 0; i < 4; i++) addMesh(ventGeo, MAT.hole, g, { x: x + 0.04, y: hc.y - 0.06 - i * 0.04, z: front + 0.002, cast: false });
      const screwGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.01, 8).rotateX(Math.PI / 2);
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
        addMesh(screwGeo, MAT.darkSteel, g, { x: x + sx * 0.28, y: hc.y + sy * 0.2, z: front + 0.004, cast: false });
      }

      // Nozzle: fixed collar + a spout that dips a little while pouring
      addMesh(new THREE.CylinderGeometry(0.075, 0.085, 0.06, 24), MAT.darkSteel, g, { x, y: housingBottom - 0.03 });
      nozzleSpout = new THREE.Group();
      nozzleSpout.position.set(x, housingBottom, 0);
      const spoutLength = nozzleLength + 0.04;
      addMesh(new THREE.CylinderGeometry(0.042, 0.028, spoutLength, 20), MAT.chrome, nozzleSpout, { y: 0.04 - spoutLength / 2 });
      addMesh(new THREE.TorusGeometry(0.029, 0.006, 6, 20).rotateX(Math.PI / 2), MAT.chrome, nozzleSpout, { y: -nozzleLength });
      g.add(nozzleSpout);

      // Amber lamp: glows while pouring
      const lx = x - 0.17, ly = hc.y + 0.1;
      addMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.035, 24).rotateX(Math.PI / 2), MAT.darkSteel, g, { x: lx, y: ly, z: front + 0.0175 });
      fillLampMat = new THREE.MeshStandardMaterial({ color: 0x3a1a06, emissive: 0xff8c2e, emissiveIntensity: 0.03, roughness: 0.25, metalness: 0 });
      addMesh(new THREE.SphereGeometry(0.05, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2).rotateX(Math.PI / 2), fillLampMat, g,
        { x: lx, y: ly, z: front + 0.034, cast: false });
      fillLampLight = new THREE.PointLight(0xff9a40, 0, 3, 2);
      fillLampLight.position.set(lx, ly, front + 0.16);
      g.add(fillLampLight);

      // Valve lever on the right side of the housing (tips down while held)
      valveLever = new THREE.Group();
      valveLever.position.set(x + hs.x / 2 + 0.03, hc.y - 0.06, 0.08);
      addMesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 16).rotateZ(Math.PI / 2), MAT.darkSteel, valveLever);
      addMesh(new THREE.BoxGeometry(0.035, 0.035, 0.34), MAT.chrome, valveLever, { z: 0.17 });
      addMesh(new THREE.SphereGeometry(0.05, 16, 10), MAT.red, valveLever, { z: 0.36 });
      const valveHit = makeHit(new THREE.SphereGeometry(0.2, 10, 8), valveLever, 0, 0, 0.3);
      g.add(valveLever);

      line.add(g);
      return { group: g, valveHit };
    }

    // --- 7c. CAP: a press with a knob on top. Pull the knob down to press a lid on.
    const CAPPER = (() => {
      const travel = 0.4;
      const armY = 3.0;
      return { x: bayX(ST.CAP), travel, armY, headBottom: CAN_TOP + 0.016 + travel, knobY: armY + 0.66 };
    })();
    let pressMove, heldLid;

    function buildCapper() {
      const g = new THREE.Group();
      const { x, headBottom, armY, knobY } = CAPPER;
      addColumnAndArm(g, x, armY, 0.13);
      addMesh(new RoundedBoxGeometry(0.28, 0.24, 0.28, 2, 0.03), MAT.paint, g, { x, y: armY });
      pressMove = new THREE.Group(); // everything that slides down together
      const headTop = headBottom + 0.1;
      addMesh(new THREE.CylinderGeometry(0.2, 0.21, 0.1, 28), MAT.darkSteel, pressMove, { x, y: headBottom + 0.05 });
      const rodLen = knobY - headTop;
      addMesh(new THREE.CylinderGeometry(0.026, 0.026, rodLen, 12), MAT.chrome, pressMove, { x, y: headTop + rodLen / 2 });
      addMesh(new THREE.SphereGeometry(0.075, 18, 12), MAT.grip, pressMove, { x, y: knobY });
      heldLid = makeLidMesh(MAT.staticAlu); // the next lid, held under the press head
      heldLid.position.set(x, headBottom - 0.016, 0);
      pressMove.add(heldLid);
      const knobHit = makeHit(new THREE.SphereGeometry(0.22, 10, 8), pressMove, x, knobY, 0);
      g.add(pressMove);
      line.add(g);
      return { group: g, knobHit };
    }

    // --- 7d. LABEL: a roll of labels behind the can. Hold it to wrap a label on.
    const LABELER = { x: bayX(ST.LABEL), rollZ: -0.45, rollY: SURFACE + 0.37, armY: 3.0 };
    let labelRoll, labelCrank;

    function buildLabeler() {
      const g = new THREE.Group();
      const { x, rollZ, rollY, armY } = LABELER;
      addColumnAndArm(g, x, armY, rollZ + 0.12);
      const spindleBottom = rollY + 0.26;
      addMesh(new THREE.CylinderGeometry(0.022, 0.022, armY - spindleBottom, 10), MAT.chrome, g, { x, y: (armY + spindleBottom) / 2, z: rollZ });
      labelRoll = new THREE.Group();
      labelRoll.position.set(x, rollY, rollZ);
      addMesh(new THREE.CylinderGeometry(0.17, 0.17, 0.5, 36), MAT.labelRoll, labelRoll);
      for (const s of [-1, 1]) addMesh(new THREE.CylinderGeometry(0.19, 0.19, 0.02, 36), MAT.darkSteel, labelRoll, { y: s * 0.26 });
      g.add(labelRoll);
      labelCrank = new THREE.Group();
      labelCrank.position.set(x, armY + 0.12, rollZ);
      addMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.06, 16), MAT.darkSteel, labelCrank);
      addMesh(new THREE.BoxGeometry(0.26, 0.03, 0.045), MAT.paint, labelCrank, { x: 0.13 });
      addMesh(new THREE.CylinderGeometry(0.028, 0.028, 0.14, 12), MAT.grip, labelCrank, { x: 0.26, y: 0.08 });
      g.add(labelCrank);
      const hits = [
        makeHit(new THREE.SphereGeometry(0.34, 10, 8), g, x, rollY, rollZ),
        makeHit(new THREE.SphereGeometry(0.3, 10, 8), g, x + 0.13, armY + 0.15, rollZ),
      ];
      line.add(g);
      return { group: g, hits };
    }

    // --- 7e. STAMP: a stamp that slams down onto the lid when you hit its button
    const STAMPER = (() => {
      const travel = 0.32;
      return { x: bayX(ST.STAMP), travel, armY: 3.0, headBottom: CAN_TOP + 0.016 + travel };
    })();
    let stampMove, stampButton, stampButtonBaseY;

    function buildStamper() {
      const g = new THREE.Group();
      const { x, headBottom, armY } = STAMPER;
      addColumnAndArm(g, x, armY, 0.13);
      addMesh(new THREE.CylinderGeometry(0.14, 0.14, 0.4, 24), MAT.paint, g, { x, y: armY - 0.02 });
      stampMove = new THREE.Group();
      const headTop = headBottom + 0.07;
      const rodLen = armY + 0.1 - headTop; // long enough to stay inside the housing at full stroke
      addMesh(new THREE.CylinderGeometry(0.03, 0.03, rodLen, 12), MAT.chrome, stampMove, { x, y: headTop + rodLen / 2 });
      addMesh(new RoundedBoxGeometry(0.2, 0.07, 0.2, 2, 0.015), MAT.darkSteel, stampMove, { x, y: headBottom + 0.047 });
      addMesh(new THREE.BoxGeometry(0.16, 0.012, 0.16), MAT.ink, stampMove, { x, y: headBottom + 0.006 });
      g.add(stampMove);

      // Button box on the front
      const by = armY - 0.05, bz = 0.3;
      addMesh(new RoundedBoxGeometry(0.2, 0.16, 0.16, 2, 0.025), MAT.paint, g, { x, y: by, z: bz });
      addMesh(new THREE.BoxGeometry(0.05, 0.05, 0.2), MAT.darkSteel, g, { x, y: by, z: 0.15 });
      stampButton = new THREE.Group();
      stampButtonBaseY = by + 0.08;
      stampButton.position.set(x, stampButtonBaseY, bz);
      addMesh(new THREE.CylinderGeometry(0.06, 0.06, 0.04, 20).translate(0, 0.02, 0), MAT.red, stampButton);
      g.add(stampButton);
      const hits = [
        makeHit(new THREE.SphereGeometry(0.2, 10, 8), g, x, by + 0.08, bz),
        makeHit(new THREE.SphereGeometry(0.26, 10, 8), g, x, armY - 0.1, 0),
      ];
      line.add(g);
      return { group: g, hits };
    }

    // --- 7f. CRATE: sits past the end of the belt and catches six cans. Shove it off to sell.
    const CRATE_OFF = 1.05;               // crate centre, measured from the end roller
    const SHELF_Y = SURFACE - 0.6;        // top of the shelf the crate sits on
    let crateTray, crateHit;

    function buildCrate() {
      const g = new THREE.Group();
      addMesh(new THREE.BoxGeometry(1.74, 0.04, 1.18), MAT.darkSteel, g, { x: CRATE_OFF, y: SHELF_Y - 0.02 });
      addMesh(new THREE.BoxGeometry(0.08, SUPPORT_DEPTH, 0.08), fadingPaint, g, { x: CRATE_OFF, y: SHELF_Y - 0.04 - SUPPORT_DEPTH / 2 });
      // two struts back to the belt frame
      const sx0 = 0.12, sy0 = BELT.y - 0.2, sx1 = CRATE_OFF - 0.7, sy1 = SHELF_Y - 0.04;
      const len = Math.hypot(sx1 - sx0, sy1 - sy0);
      for (const z of [-0.5, 0.5]) {
        const strut = addMesh(new THREE.BoxGeometry(len, 0.045, 0.045), MAT.darkSteel, g, { x: (sx0 + sx1) / 2, y: (sy0 + sy1) / 2, z });
        strut.rotation.z = Math.atan2(sy1 - sy0, sx1 - sx0);
      }

      crateTray = new THREE.Group(); // the part that gets shoved off
      crateTray.position.set(CRATE_OFF, SHELF_Y, 0);
      const m = MAT.crate;
      addMesh(new THREE.BoxGeometry(1.56, 0.03, 1.04), m, crateTray, { y: 0.015 });
      for (const z of [-0.505, 0.505]) addMesh(new THREE.BoxGeometry(1.56, 0.24, 0.03), m, crateTray, { y: 0.12, z });
      for (const x of [-0.765, 0.765]) addMesh(new THREE.BoxGeometry(0.03, 0.24, 1.04), m, crateTray, { x, y: 0.12 });
      for (const x of [-0.26, 0.26]) addMesh(new THREE.BoxGeometry(0.015, 0.18, 1.0), m, crateTray, { x, y: 0.12 });
      addMesh(new THREE.BoxGeometry(1.5, 0.18, 0.015), m, crateTray, { y: 0.12 });
      crateHit = makeHit(new THREE.BoxGeometry(1.8, 1.0, 1.25), crateTray, 0, 0.4, 0);
      g.add(crateTray);
      endCap.add(g);
      return g;
    }

    /* =====================================================================
       8. THINGS YOU DRAG: the pull chain and the press knob
       ===================================================================== */

    const _tmp = new THREE.Vector3();

    // The chain: drag the handle down, a spring pulls it back with a little bounce.
    // A tug past `triggerAt` clicks the switch.
    class PullChain {
      constructor(anchor, restLength) {
        this.restLength = restLength;
        this.pitch = 0.072;         // spacing between links
        this.maxPull = 0.72;
        this.triggerAt = 0.28;
        this.k = 140;               // spring stiffness
        this.c = 7.5;               // spring damping (lower = bouncier)
        this.d = 0;                 // how far it's pulled down
        this.v = 0;
        this.lastV = 0;
        this.dragging = false;
        this.dragTarget = 0;
        this.tripped = false;
        this.onTug = null;

        // gentle swinging: side to side (A) and toward/away from the camera (B)
        this.swayA = 0; this.swayAV = 0; this.swayTarget = 0;
        this.swayB = 0; this.swayBV = 0;
        this.faceAxis = new THREE.Vector3(Math.sin(VIEW.azimuth), 0, Math.cos(VIEW.azimuth));
        this.sideAxis = new THREE.Vector3(0, 1, 0).cross(this.faceAxis).normalize();
        this._qa = new THREE.Quaternion();
        this._qb = new THREE.Quaternion();

        this.group = new THREE.Group();
        this.group.position.copy(anchor);
        scene.add(this.group);

        const linkGeo = new THREE.TorusGeometry(0.026, 0.0072, 6, 16).scale(1, 1.65, 1);
        const count = Math.ceil((this.restLength + 0.3) / this.pitch) + 2;
        this.links = [];
        for (let i = 0; i < count; i++) {
          const link = addMesh(linkGeo, MAT.brass, this.group, { receive: false });
          link.rotation.y = (i % 2) * (Math.PI / 2);
          this.links.push(link);
        }

        this.handle = new THREE.Group();
        addMesh(new THREE.TorusGeometry(0.03, 0.008, 6, 16).scale(1, 1.3, 1), MAT.brass, this.handle, { y: -0.025 });
        addMesh(new THREE.CylinderGeometry(0.022, 0.05, 0.05, 20), MAT.brass, this.handle, { y: -0.075 });
        addMesh(new THREE.CylinderGeometry(0.045, 0.05, 0.2, 20), MAT.grip, this.handle, { y: -0.2 });
        const groove = new THREE.TorusGeometry(0.047, 0.005, 6, 20).rotateX(Math.PI / 2);
        for (const y of [-0.15, -0.2, -0.25]) addMesh(groove, MAT.grip, this.handle, { y });
        addMesh(new THREE.CylinderGeometry(0.056, 0.05, 0.03, 20), MAT.brass, this.handle, { y: -0.315 });
        addMesh(new THREE.SphereGeometry(0.03, 16, 10), MAT.brass, this.handle, { y: -0.335 });
        this.group.add(this.handle);
        this.hitArea = makeHit(new THREE.CapsuleGeometry(0.26, 0.5, 4, 8), this.handle, 0, -0.12, 0);

        this.dragPlane = new THREE.Plane();
        this.grabPoint = new THREE.Vector3();
        this._hit = new THREE.Vector3();
        this.layout(0);
      }

      beginDrag(ray) {
        // drag on an invisible vertical sheet facing the camera
        const normal = _tmp.subVectors(camera.position, this.group.position).setY(0).normalize();
        this.dragPlane.setFromNormalAndCoplanarPoint(normal, this.handle.getWorldPosition(this._hit));
        if (!ray.intersectPlane(this.dragPlane, this.grabPoint)) this.grabPoint.copy(this._hit);
        this.dragStartD = this.d;
        this.dragTarget = this.d;
        this.dragging = true;
        Sound.clink(0.55);
      }

      drag(ray) {
        if (!ray.intersectPlane(this.dragPlane, this._hit)) return;
        const raw = this.dragStartD + (this.grabPoint.y - this._hit.y);
        this.dragTarget = raw >= 0
          ? this.maxPull * (1 - Math.exp(-raw / this.maxPull))   // easy at first, then resists
          : Math.max(raw * 0.25, -0.06);
        const sideways = _tmp.subVectors(this._hit, this.grabPoint).dot(this.sideAxis);
        this.swayTarget = clamp(sideways * 0.35, -0.28, 0.28);
      }

      endDrag() {
        if (!this.dragging) return;
        this.dragging = false;
        this.swayTarget = 0;
        this.swayBV += (Math.random() - 0.5) * 0.9;
        this.swayAV += (Math.random() - 0.5) * 0.5;
        Sound.clink(0.4 + Math.min(0.6, Math.abs(this.v) * 0.25));
      }

      update(dt, time) {
        const prevD = this.d;
        if (this.dragging) {
          this.d = damp(this.d, this.dragTarget, 28, dt);
          this.v = dt > 0 ? (this.d - prevD) / dt : 0;
        } else {
          const steps = 4, h = dt / steps;
          for (let i = 0; i < steps; i++) {
            this.v += (-this.k * this.d - this.c * this.v) * h;
            this.d += this.v * h;
          }
          if (this.d < -0.16) { this.d = -0.16; this.v = Math.max(this.v, 0); }
          if (this.lastV < -0.05 && this.v >= 0 && this.d < -0.02) Sound.clink(0.3); // rattle at the top of the bounce
        }
        this.lastV = this.v;

        if (this.dragging && !this.tripped && this.d > this.triggerAt) {
          this.tripped = true;
          if (this.onTug) this.onTug();
        }
        if (this.tripped && this.d < 0.06) this.tripped = false;

        const stiffness = 9, friction = 0.9;
        if (this.dragging) {
          const prevA = this.swayA;
          this.swayA = damp(this.swayA, this.swayTarget, 10, dt);
          this.swayAV = dt > 0 ? (this.swayA - prevA) / dt : 0;
        } else {
          this.swayAV += (-stiffness * this.swayA - friction * this.swayAV) * dt;
          this.swayA += this.swayAV * dt;
        }
        this.swayBV += (-stiffness * this.swayB - friction * this.swayBV) * dt;
        this.swayB += this.swayBV * dt;
        const idle = Math.sin(time * 0.9) * 0.006;
        this._qa.setFromAxisAngle(this.faceAxis, this.swayA + idle);
        this._qb.setFromAxisAngle(this.sideAxis, this.swayB);
        this.group.quaternion.multiplyQuaternions(this._qa, this._qb);
        this.layout(this.d);
      }

      // Place the links between the switch box and the handle
      layout(d) {
        const total = this.restLength + d;
        const stretch = 1 + Math.max(0, d) * 0.16;
        for (let i = 0; i < this.links.length; i++) {
          const dist = total - (i + 0.5) * this.pitch * stretch;
          this.links[i].visible = dist > 0.02;
          this.links[i].position.y = -dist;
        }
        this.handle.position.y = -total;
      }
    }

    // The capper knob: drag it down to push the press; a spring lifts it back up.
    class PressHandle {
      constructor(travel) {
        this.travel = travel;
        this.p = 0;               // 0 = up, 1 = all the way down
        this.v = 0;
        this.target = 0;
        this.dragging = false;
        this.plane = new THREE.Plane();
        this.grab = new THREE.Vector3();
        this._hit = new THREE.Vector3();
      }
      beginDrag(ray, knobWorld) {
        const normal = _tmp.subVectors(camera.position, knobWorld).setY(0).normalize();
        this.plane.setFromNormalAndCoplanarPoint(normal, knobWorld);
        if (!ray.intersectPlane(this.plane, this.grab)) this.grab.copy(knobWorld);
        this.startP = this.p;
        this.target = this.p;
        this.dragging = true;
      }
      drag(ray) {
        if (!ray.intersectPlane(this.plane, this._hit)) return;
        this.target = clamp01(this.startP + (this.grab.y - this._hit.y) / this.travel);
      }
      endDrag() { this.dragging = false; }
      update(dt) {
        if (this.dragging) {
          const prev = this.p;
          this.p = damp(this.p, this.target, 22, dt);
          this.v = dt > 0 ? (this.p - prev) / dt : 0;
        } else {
          const steps = 4, h = dt / steps;
          for (let i = 0; i < steps; i++) {
            this.v += (-90 * this.p - 11 * this.v) * h;
            this.p += this.v * h;
          }
          if (this.p < -0.05) { this.p = -0.05; this.v = Math.max(this.v, 0); }
        }
      }
    }

    /* =====================================================================
       9. CANS
       Each can remembers what has been done to it: fill, lid, label, stamp.
       ===================================================================== */

    const cans = [];
    const _v = new THREE.Vector3();

    class Can {
      constructor(x) {
        this.x = x;                // position along the belt
        this.fill = 0;             // 0 empty .. 1 full .. above 1 = spilling over
        this.maxFill = 0;
        this.filledDone = false;   // poured and valve let go
        this.capped = false;
        this.labelProgress = 0;    // 0 .. 1 (wrapped all the way round)
        this.labeled = false;
        this.stamped = false;
        this.xray = 0;             // see-through body while at the filler, so you can watch it fill
        this.xrayTarget = 0;
        this.opacity = 1;
        this.squash = 0;
        this.dropY = 0;
        this.state = 'belt';       // 'belt' | 'falling' | 'crating' | 'crated'
        this.appearing = false;

        this.mat = {
          alu: MAT.canAlu.clone(),
          body: MAT.canBody.clone(),
          lid: MAT.canLid.clone(),
          label: MAT.canLabel.clone(),
          inner: MAT.canInner.clone(),
          ink: MAT.ink.clone(),
          liquid: MAT.liquid.clone(),
          surface: MAT.liquidSurface.clone(),
        };
        // The liquid is a full-height cylinder cut off by a level plane at the fill height
        this.levelPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
        this.mat.liquid.clippingPlanes = [this.levelPlane];

        this.group = new THREE.Group();
        this.body = new THREE.Group();
        this.group.add(this.body);
        const G = CAN_GEO, m = this.mat, b = this.body;
        const part = (geo, mat, order, cast = true) => {
          const mesh = addMesh(geo, mat, b, { cast });
          mesh.renderOrder = order; // inside first, then the see-through outside
          return mesh;
        };
        part(G.inner, m.inner, 1, false);
        part(G.innerBottom, m.inner, 1, false);
        part(G.bottomRing, m.alu, 2);
        part(G.bottomCap, m.alu, 2);
        part(G.shoulder, m.alu, 2);
        part(G.neck, m.alu, 2);
        part(G.rim, m.alu, 2);
        part(G.body, m.body, 3);
        this.labelGeo = G.labelBand.clone();
        this.labelGeo.setDrawRange(0, 0);
        this.labelMesh = part(this.labelGeo, m.label, 4);
        this.labelMesh.visible = false;

        this.liquid = new THREE.Group();
        b.add(this.liquid);
        addMesh(G.liquid, m.liquid, this.liquid, { cast: false });
        this.surface = addMesh(G.surface, m.surface, this.liquid, { cast: false });
        this.liquid.visible = false;

        this.lid = makeLidMesh(m.lid);
        this.lid.position.y = CAN.height - 0.004;
        this.lid.visible = false;
        b.add(this.lid);
        this.mark = addMesh(G.mark, m.ink, this.lid, { x: -0.07, y: 0.0175, cast: false });
        this.mark.visible = false;

        scene.add(this.group);
        cans.push(this);
        this.place();
      }

      get levelLocal() { return lerp(CAN.levelMin, CAN.levelMax, Math.min(1, this.fill)); }

      levelWorldY() { return this.body.localToWorld(_v.set(0, this.levelLocal, 0)).y; }

      place() {
        if (this.state === 'belt') this.group.position.set(this.x, SURFACE + this.dropY, 0);
      }

      // Drop from height h onto the belt with a little bounce
      appear(h) {
        this.appearing = true;
        this.appearT = 0;
        this.bounces = 0;
        this.dropH = h;
        this.dropY = h;
      }

      startFall(speed) {
        this.state = 'falling';
        this.fallT = 0;
        this.velocity = new THREE.Vector3(Math.max(speed, 0.9), 0.35, 0);
        this.spin = new THREE.Vector3(rand(-0.4, 0.4), rand(-0.6, 0.6), rand(-3.6, -2.6));
      }

      update(dt) {
        if (this.state === 'falling') {
          this.fallT += dt;
          this.velocity.y -= 9.5 * dt;
          this.group.position.addScaledVector(this.velocity, dt);
          this.group.rotation.x += this.spin.x * dt;
          this.group.rotation.y += this.spin.y * dt;
          this.group.rotation.z += this.spin.z * dt;
          this.opacity = 1 - Ease.inQuad(clamp01(this.fallT / 1.5));
          if (this.fallT > 1.7) { this.dispose(); return; }
        } else if (this.state === 'crating') {
          // hop off the end of the belt into a slot in the crate
          this.crateT += dt;
          const k = clamp01(this.crateT / 0.5);
          const to = crate.slotWorld(this.slot, _v);
          const f = this.crateFrom;
          this.group.position.set(
            lerp(f.x, to.x, Ease.inOutSine(k)),
            lerp(f.y, to.y, k * k) + Math.sin(Math.PI * k) * 0.18,
            lerp(f.z, to.z, Ease.inOutSine(k))
          );
          if (k >= 1) crate.land(this);
        }

        if (this.appearing) {
          this.appearT += dt;
          const k = clamp01(this.appearT / 0.9);
          this.dropY = this.dropH * (1 - Ease.outBounce(k));
          const impacts = [1 / 2.75, 2 / 2.75, 2.5 / 2.75];
          if (this.bounces < impacts.length && k >= impacts[this.bounces]) {
            Sound.tock(this.bounces === 0 ? 1 : 0.3 / this.bounces);
            if (this.bounces === 0) this.squash = 0.5;
            this.bounces++;
          }
          if (k >= 1) { this.appearing = false; this.dropY = 0; }
        }

        this.place();

        this.squash = damp(this.squash, 0, 9, dt);
        const sq = this.squash;
        this.body.scale.set(1 + 0.03 * sq, 1 - 0.06 * sq, 1 + 0.03 * sq);
        this.xray = damp(this.xray, this.xrayTarget, 6, dt);

        // Label: turn the can as it wraps, and reveal the label slice by slice
        if (this.labelProgress > 0) {
          this.body.rotation.y = -this.labelProgress * Math.PI * 2;
          const slices = Math.floor(this.labelProgress * LABEL_SLICES + 0.0001);
          this.labelGeo.setDrawRange(0, slices * 6);
          this.labelMesh.visible = slices > 0;
        }

        // Liquid only drawn while it can be seen
        const showLiquid = this.fill > 0.001 && this.state === 'belt' && !(this.capped && this.xray < 0.001);
        this.liquid.visible = showLiquid;
        if (showLiquid) {
          this.surface.position.y = this.levelLocal;
          this.levelPlane.constant = this.surface.getWorldPosition(_v).y + 0.002;
        }

        const o = this.opacity;
        this.mat.alu.opacity = o;
        this.mat.lid.opacity = o;
        this.mat.inner.opacity = o;
        this.mat.label.opacity = o;
        this.mat.ink.opacity = o;
        this.mat.body.opacity = o * (1 - 0.8 * this.xray);
      }

      dispose() {
        this.group.removeFromParent();
        for (const mat of Object.values(this.mat)) mat.dispose();
        this.labelGeo.dispose();
        const i = cans.indexOf(this);
        if (i >= 0) cans.splice(i, 1);
      }
    }

    /* =====================================================================
       10. POURING STREAM, SPLASHES, DUST AND THE LIGHT BEAM
       ===================================================================== */

    const stream = {
      // a thin cylinder with its origin at the top, so stretching it grows it downward
      mesh: new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 1, 14, 4, true).translate(0, -0.5, 0), MAT.stream),
      phase: 'off',   // 'falling' | 'flowing' | 'ending' | 'off'
      t: 0,
      hitting: false,
      start() { this.phase = 'falling'; this.t = 0; },
      stop() { if (this.phase === 'falling' || this.phase === 'flowing') { this.phase = 'ending'; this.t = 0; } },
      update(dt, time, x, tipY, surfaceY) {
        this.t += dt;
        const fallen = 0.5 * 7 * this.t * this.t;
        let top = tipY + 0.01, bottom = surfaceY;
        if (this.phase === 'falling') {
          bottom = Math.max(surfaceY, tipY - fallen);
          if (bottom <= surfaceY) this.phase = 'flowing';
        } else if (this.phase === 'ending') {
          top = tipY - fallen;
          if (top <= surfaceY) this.phase = 'off';
        }
        this.hitting = this.phase === 'flowing' || this.phase === 'ending';
        const length = top - bottom;
        this.mesh.visible = this.phase !== 'off' && length > 0.003;
        if (this.mesh.visible) {
          const wobble = 1 + Math.sin(time * 37) * 0.05 + Math.sin(time * 23) * 0.04;
          this.mesh.position.set(x, top, 0);
          this.mesh.scale.set(wobble, length, wobble);
        }
        TEX.stream.offset.y += dt * 2.4;
      },
    };
    stream.mesh.visible = false;
    scene.add(stream.mesh);

    // Droplets (splashes where the stream lands, and foam spilling over a too-full can)
    const splash = (() => {
      const COUNT = 90;
      const positions = new Float32Array(COUNT * 3).fill(-100);
      const velocity = new Float32Array(COUNT * 3);
      const life = new Float32Array(COUNT);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xd9925a, map: TEX.dot, size: 0.028, transparent: true, opacity: 0.85, depthWrite: false,
      }));
      points.frustumCulled = false;
      scene.add(points);
      let next = 0;
      return {
        emit(x, y, z, vx, vy, vz, t) {
          const i = next++ % COUNT;
          positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
          velocity[i * 3] = vx; velocity[i * 3 + 1] = vy; velocity[i * 3 + 2] = vz;
          life[i] = t;
        },
        update(dt) {
          for (let i = 0; i < COUNT; i++) {
            if (life[i] <= 0) continue;
            life[i] -= dt;
            velocity[i * 3 + 1] -= 7 * dt;
            positions[i * 3] += velocity[i * 3] * dt;
            positions[i * 3 + 1] += velocity[i * 3 + 1] * dt;
            positions[i * 3 + 2] += velocity[i * 3 + 2] * dt;
            if (life[i] <= 0) positions[i * 3 + 1] = -100;
          }
          geo.attributes.position.needsUpdate = true;
        },
      };
    })();

    // Dust specks drifting in the spotlight (they follow the view along the line)
    const dust = (() => {
      const COUNT = 520;
      const halfX = 5, minY = -4, maxY = 7.5, minZ = -3.5, maxZ = 4.0;
      const positions = new Float32Array(COUNT * 3);
      const drift = new Float32Array(COUNT * 3);
      const seeds = new Float32Array(COUNT);
      for (let i = 0; i < COUNT; i++) {
        positions[i * 3] = rand(-halfX, halfX);
        positions[i * 3 + 1] = rand(minY, maxY);
        positions[i * 3 + 2] = rand(minZ, maxZ);
        drift[i * 3] = rand(-0.03, 0.03);
        drift[i * 3 + 1] = rand(-0.035, 0.01);
        drift[i * 3 + 2] = rand(-0.03, 0.03);
        seeds[i] = Math.random();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: 0.085 },
          uScale: { value: window.innerHeight * pixelRatio * 0.5 },
          uColor: { value: new THREE.Color(0xffd9a8).multiplyScalar(0.9) },
          uLightPos: { value: new THREE.Vector3() },
          uLightDir: { value: KEY_DIR },
          uCosOuter: { value: Math.cos(keyLight.angle * 0.62) },
          uCosInner: { value: Math.cos(keyLight.angle * 0.22) },
        },
        vertexShader: /* glsl */`
          uniform float uTime, uSize, uScale, uCosOuter, uCosInner;
          uniform vec3 uLightPos, uLightDir;
          attribute float aSeed;
          varying float vAlpha;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            float inBeam = smoothstep(uCosOuter, uCosInner, dot(normalize(position - uLightPos), uLightDir));
            float twinkle = 0.55 + 0.45 * sin(uTime * (0.5 + aSeed * 1.6) + aSeed * 40.0);
            float nearLamp = smoothstep(1.5, 4.0, distance(position, uLightPos));
            vAlpha = inBeam * twinkle * nearLamp;
            gl_PointSize = uSize * (0.6 + aSeed * 0.9) * uScale / -mv.z;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: /* glsl */`
          uniform vec3 uColor;
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            gl_FragColor = vec4(uColor, smoothstep(0.5, 0.0, d) * vAlpha);
          }`,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const points = new THREE.Points(geo, material);
      points.frustumCulled = false;
      scene.add(points);

      return {
        material,
        update(dt, time, cx, viewDist) {
          for (let i = 0; i < COUNT; i++) {
            const s = seeds[i];
            let x = positions[i * 3] + (drift[i * 3] + Math.sin(time * 0.15 + s * 31) * 0.035) * dt;
            let y = positions[i * 3 + 1] + (drift[i * 3 + 1] + Math.cos(time * 0.11 + s * 17) * 0.025) * dt;
            let z = positions[i * 3 + 2] + (drift[i * 3 + 2] + Math.sin(time * 0.13 + s * 7) * 0.03) * dt;
            if (y < minY) y = maxY; else if (y > maxY) y = minY;
            if (x < cx - halfX) x += halfX * 2; else if (x > cx + halfX) x -= halfX * 2;
            if (z < minZ) z = maxZ; else if (z > maxZ) z = minZ;
            positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
          }
          geo.attributes.position.needsUpdate = true;
          material.uniforms.uTime.value = time;
          material.uniforms.uLightPos.value.copy(keyLight.position);
          material.uniforms.uSize.value = 0.085 * (viewDist / VIEW.startDist); // specks stay fine at any zoom
        },
      };
    })();

    // A very faint cone of light, like a beam through dusty air
    const beam = (() => {
      const length = KEY_OFFSET.length() * 1.8;
      const geo = new THREE.CylinderGeometry(0.12, length * Math.tan(keyLight.angle * 0.62), length, 48, 1, true)
        .translate(0, -length / 2, 0);
      const material = new THREE.ShaderMaterial({
        uniforms: { uColor: { value: new THREE.Color(0xffc690) }, uStrength: { value: 0.016 } },
        vertexShader: /* glsl */`
          varying vec3 vNormal;
          varying vec3 vView;
          varying float vAlong;
          void main() {
            vAlong = uv.y;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vView = normalize(-mv.xyz);
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: /* glsl */`
          uniform vec3 uColor;
          uniform float uStrength;
          varying vec3 vNormal;
          varying vec3 vView;
          varying float vAlong;
          void main() {
            float facing = pow(abs(dot(normalize(vNormal), normalize(vView))), 2.0);
            float along = smoothstep(0.0, 0.6, vAlong) * smoothstep(1.0, 0.85, vAlong);
            gl_FragColor = vec4(uColor, facing * along * uStrength);
          }`,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
      });
      const mesh = new THREE.Mesh(geo, material);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), KEY_DIR);
      mesh.renderOrder = 10;
      scene.add(mesh);
      return mesh;
    })();

    /* =====================================================================
       11. SOUND (made live with the Web Audio API; starts on the first click)
       ===================================================================== */

    const Sound = {
      ctx: null,
      last: { hum: -1, pour: -1, pitch: -1, rustle: -1 },

      unlock() {
        if (!this.ctx) {
          try { this.init(); } catch (err) { return; }
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },

      init() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error('no audio');
        const ctx = (this.ctx = new AC());
        this.master = ctx.createGain();
        this.master.gain.value = 0.7;
        const compressor = ctx.createDynamicsCompressor();
        this.master.connect(compressor);
        compressor.connect(ctx.destination);

        const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        this.noise = buffer;
        const loopNoise = (rate = 1) => {
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          src.playbackRate.value = rate;
          src.start();
          return src;
        };

        // Motor hum (volume follows belt speed)
        this.humGain = ctx.createGain();
        this.humGain.gain.value = 0;
        this.humGain.connect(this.master);
        const humFilter = ctx.createBiquadFilter();
        humFilter.type = 'lowpass';
        humFilter.frequency.value = 380;
        humFilter.Q.value = 0.7;
        humFilter.connect(this.humGain);
        this.humOscillators = [];
        for (const [type, freq, vol] of [['sawtooth', 52, 0.35], ['sawtooth', 104.6, 0.16], ['sine', 156, 0.25]]) {
          const osc = ctx.createOscillator();
          osc.type = type;
          osc.frequency.value = freq;
          const g = ctx.createGain();
          g.gain.value = vol;
          osc.connect(g);
          g.connect(humFilter);
          osc.start();
          this.humOscillators.push({ osc, base: freq });
        }
        const rumble = ctx.createBiquadFilter();
        rumble.type = 'bandpass';
        rumble.frequency.value = 180;
        rumble.Q.value = 0.8;
        const rumbleGain = ctx.createGain();
        rumbleGain.gain.value = 0.3;
        loopNoise().connect(rumble);
        rumble.connect(rumbleGain);
        rumbleGain.connect(this.humGain);

        // Pouring: filtered noise whose pitch rises as the can fills
        this.pourGain = ctx.createGain();
        this.pourGain.gain.value = 0;
        this.pourGain.connect(this.master);
        const highpass = ctx.createBiquadFilter();
        highpass.type = 'highpass';
        highpass.frequency.value = 250;
        loopNoise(0.9).connect(highpass);
        this.pourFilter = ctx.createBiquadFilter();
        this.pourFilter.type = 'bandpass';
        this.pourFilter.frequency.value = 600;
        this.pourFilter.Q.value = 2.5;
        highpass.connect(this.pourFilter);
        this.pourFilter.connect(this.pourGain);
        const fizz = ctx.createBiquadFilter();
        fizz.type = 'bandpass';
        fizz.frequency.value = 2600;
        fizz.Q.value = 0.6;
        const fizzGain = ctx.createGain();
        fizzGain.gain.value = 0.22;
        highpass.connect(fizz);
        fizz.connect(fizzGain);
        fizzGain.connect(this.pourGain);
        const wobble = ctx.createOscillator();
        wobble.frequency.value = 7;
        const wobbleAmount = ctx.createGain();
        wobbleAmount.gain.value = 60;
        wobble.connect(wobbleAmount);
        wobbleAmount.connect(this.pourFilter.frequency);
        wobble.start();

        // Paper rustle while a label wraps on
        this.rustleGain = ctx.createGain();
        this.rustleGain.gain.value = 0;
        this.rustleGain.connect(this.master);
        const rustle = ctx.createBiquadFilter();
        rustle.type = 'bandpass';
        rustle.frequency.value = 3400;
        rustle.Q.value = 0.7;
        loopNoise(0.7).connect(rustle);
        rustle.connect(this.rustleGain);
      },

      ping(freq, time, duration, volume, type = 'sine') {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(volume, time + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        osc.connect(g);
        g.connect(this.master);
        osc.start(time);
        osc.stop(time + duration + 0.05);
      },

      burst(time, duration, volume, filterType, freq, q = 0.8) {
        const ctx = this.ctx;
        const src = ctx.createBufferSource();
        src.buffer = this.noise;
        const filter = ctx.createBiquadFilter();
        filter.type = filterType;
        filter.frequency.value = freq;
        filter.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(volume, time);
        g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        src.connect(filter);
        filter.connect(g);
        g.connect(this.master);
        src.start(time, Math.random() * 1.5);
        src.stop(time + duration + 0.05);
      },

      thud(from, to, duration, volume) {
        const ctx = this.ctx, t = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(from, t);
        osc.frequency.exponentialRampToValueAtTime(to, t + duration * 0.6);
        const g = ctx.createGain();
        g.gain.setValueAtTime(volume, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + duration + 0.05);
      },

      clink(strength = 1) {           // chain links
        if (!this.ctx) return;
        const t0 = this.ctx.currentTime;
        const hits = 2 + Math.floor(Math.random() * 2);
        for (let i = 0; i < hits; i++) {
          const t = t0 + i * rand(0.025, 0.065);
          const f = rand(2300, 4000);
          const v = 0.1 * strength * (1 - i * 0.25);
          this.ping(f, t, rand(0.08, 0.16), v);
          this.ping(f * 2.71, t, 0.05, v * 0.45);
