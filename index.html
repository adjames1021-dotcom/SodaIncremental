          this.ping(f * 1.53, t, 0.07, v * 0.3);
          this.burst(t, 0.015, v * 0.6, 'highpass', 4000);
        }
      },

      click() {                       // switches and buttons
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.burst(t, 0.025, 0.35, 'bandpass', 1900, 1.2);
        this.ping(1300, t, 0.04, 0.12, 'triangle');
        this.burst(t + 0.07, 0.02, 0.2, 'bandpass', 2400, 1.2);
      },

      clunk() {                       // lid pressed on
        if (!this.ctx) return;
        this.thud(170, 60, 0.22, 0.55);
        const t = this.ctx.currentTime;
        this.burst(t, 0.06, 0.4, 'lowpass', 900);
        this.ping(3100, t, 0.09, 0.05);
      },

      thump() {                       // stamp
        if (!this.ctx) return;
        this.thud(120, 55, 0.2, 0.5);
        this.burst(this.ctx.currentTime, 0.05, 0.3, 'lowpass', 600);
      },

      clank(strength = 1) {           // metal on nothing
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.ping(620, t, 0.18, 0.08 * strength, 'triangle');
        this.ping(1430, t, 0.12, 0.05 * strength);
        this.burst(t, 0.03, 0.2 * strength, 'bandpass', 2200, 1.5);
      },

      tock(strength = 1) {            // can landing
        if (!this.ctx) return;
        this.thud(520, 320, 0.12, 0.22 * strength);
        this.burst(this.ctx.currentTime, 0.03, 0.15 * strength, 'bandpass', 1300);
      },

      ching(strength = 1) {           // money
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.ping(2350, t, 0.25, 0.06 * strength);
        this.ping(3520, t + 0.05, 0.3, 0.05 * strength);
        this.ping(4700, t + 0.05, 0.15, 0.02 * strength);
      },

      buy() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.burst(t, 0.02, 0.3, 'bandpass', 1500, 1.4);
        this.ping(880, t, 0.08, 0.08, 'triangle');
        this.ping(1320, t + 0.06, 0.12, 0.07);
      },

      // Called every frame
      update(beltLevel, pouring, fill, rustling) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        if (Math.abs(beltLevel - this.last.hum) > 0.01) {
          this.last.hum = beltLevel;
          this.humGain.gain.setTargetAtTime(beltLevel * 0.16, t, 0.1);
          for (const h of this.humOscillators) h.osc.frequency.setTargetAtTime(h.base * (0.8 + 0.25 * beltLevel), t, 0.15);
        }
        const pourLevel = pouring ? 1 : 0;
        if (pourLevel !== this.last.pour) {
          this.last.pour = pourLevel;
          this.pourGain.gain.setTargetAtTime(pourLevel * 0.5, t, pouring ? 0.04 : 0.12);
        }
        if (Math.abs(fill - this.last.pitch) > 0.01) {
          this.last.pitch = fill;
          this.pourFilter.frequency.setTargetAtTime(450 + Math.min(1.1, fill) * 1300, t, 0.1);
        }
        const rustleLevel = rustling ? 1 : 0;
        if (rustleLevel !== this.last.rustle) {
          this.last.rustle = rustleLevel;
          this.rustleGain.gain.setTargetAtTime(rustleLevel * 0.12, t, 0.05);
        }
      },
    };

    /* =====================================================================
       12. THE LINE IN MOTION
       The button moves the belt exactly one station. A can won't leave a
       station until that station's job has been done to it, and cans
       queue up behind each other.
       ===================================================================== */

    const belt = { indexing: false, t: 0, s: 0, speed: 0 };

    function startIndex() {
      if (belt.indexing) return false;
      belt.indexing = true;
      belt.t = 0;
      belt.s = 0;
      return true;
    }

    // The can sitting at station i (if any)
    function canAt(i) {
      const x = bayX(i);
      for (const c of cans) if (c.state === 'belt' && Math.abs(c.x - x) < 0.03) return c;
      return null;
    }

    // Does station i still have a job to do on this can?
    function requires(i, c) {
      if (i === ST.FILL) return !c.filledDone;
      if (i === ST.CAP) return !c.capped;
      if (i === ST.LABEL) return !c.labeled;
      if (i === ST.STAMP) return !c.stamped;
      return false;
    }

    function moveCans(ds, speed) {
      if (ds <= 0) return;
      const end = endX();
      const n = bayCount();
      const blockedAtEnd = game.own.crate && !crate.accepting();
      const onBelt = cans.filter((c) => c.state === 'belt').sort((a, b) => b.x - a.x); // front first
      let ahead = null;
      for (const c of onBelt) {
        let limit = c.x + ds;
        for (let i = 1; i < n; i++) {
          const sx = bayX(i);
          if (sx >= c.x - 0.001 && requires(i, c)) { limit = Math.min(limit, sx); break; }
        }
        if (ahead) limit = Math.min(limit, ahead.x - SPACING);
        if (blockedAtEnd) limit = Math.min(limit, end - 0.04);
        if (limit > c.x) c.x = limit;
        if (!blockedAtEnd && c.x >= end - 0.04) {
          if (game.own.crate) crate.receive(c);
          else {
            c.startFall(speed);
            earn(canValue(c), c.group.position.clone().add(_tmp.set(0, 0.9, 0)));
          }
          continue; // it left the belt, so it doesn't block the can behind it
        }
        ahead = c;
      }
    }

    function updateBelt(dt) {
      let ds = 0;
      if (belt.indexing) {
        belt.t += dt;
        const k = clamp01(belt.t / indexTime());
        const s = BAY * Ease.inOutSine(k);
        ds = s - belt.s;
        belt.s = s;
        if (k >= 1) belt.indexing = false;
      }
      belt.speed = dt > 0 ? ds / dt : 0;
      TEX.belt.offset.x -= ds / BELT.tile;
      for (const roller of rollers) roller.rotation.z -= ds / R;
      moveCans(ds, belt.speed);
    }

    // Chain tug: drop an empty can, if there's room under the magazine
    function dispense() {
      const x = bayX(ST.DROP);
      if (cans.some((c) => c.state === 'belt' && Math.abs(c.x - x) < SPACING)) { Sound.clank(0.4); return; }
      const c = new Can(x);
      c.appear(MAG_BOTTOM - SURFACE);
    }

    // Money in, with a little number where it happened
    function earn(amount, worldPos) {
      if (amount <= 0.0001) return;
      game.money += amount;
      game.seen.money = true;
      showPop(worldPos, amount);
      Sound.ching(Math.min(1, 0.5 + Math.log10(1 + amount) * 0.2));
    }

    function showPop(worldPos, amount) {
      const v = worldPos.clone().project(camera);
      if (v.z > 1) return;
      const el = document.createElement('div');
      el.className = 'pop';
      el.textContent = '+' + fmt(amount);
      el.style.left = ((v.x + 1) / 2) * window.innerWidth + 'px';
      el.style.top = ((1 - v.y) / 2) * window.innerHeight + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }

    // --- Filler: hold the lever to pour into the can below
    const valve = { open: false };
    let nozzleY = 0, fillLamp = 0;

    function closeValve() {
      if (!valve.open) return;
      valve.open = false;
      const c = canAt(ST.FILL);
      if (c && c.fill > 0.02) c.filledDone = true;
    }

    function updateFiller(dt, time) {
      const c = canAt(ST.FILL);
      for (const can of cans) can.xrayTarget = 0;
      if (c && !c.capped) c.xrayTarget = 1;

      // where the stream lands: the liquid, a lid, or the bare belt
      let surfaceY = SURFACE + 0.005;
      if (c) surfaceY = c.capped ? CAN_TOP + 0.02 : c.levelWorldY();

      if (valve.open && stream.phase !== 'falling' && stream.phase !== 'flowing') stream.start();
      if (!valve.open) stream.stop();

      nozzleY = damp(nozzleY, valve.open ? -0.04 : 0, 8, dt);
      nozzleSpout.position.y = FILL.housingBottom + nozzleY;
      valveLever.rotation.x = damp(valveLever.rotation.x, valve.open ? 0.6 : 0, 14, dt);
      stream.update(dt, time, FILL.x, FILL.tipY + nozzleY, surfaceY);

      if (valve.open && c && !c.capped && stream.hitting) {
        c.fill = Math.min(1.2, c.fill + pourRate() * dt);
        c.maxFill = Math.max(c.maxFill, c.fill);
      }
      if (stream.phase === 'flowing' && Math.random() < 0.8) {
        splash.emit(FILL.x + rand(-0.02, 0.02), surfaceY, rand(-0.02, 0.02), rand(-0.35, 0.35), rand(0.4, 0.9), rand(-0.35, 0.35), rand(0.2, 0.4));
      }
      if (c && c.fill > 1 && stream.hitting) { // too full: foam over the rim
        const a = rand(0, Math.PI * 2);
        splash.emit(FILL.x + Math.cos(a) * 0.19, CAN_TOP + 0.01, Math.sin(a) * 0.19, Math.cos(a) * 0.3, 0.15, Math.sin(a) * 0.3, 0.5);
      }

      fillLamp = damp(fillLamp, valve.open ? 1 : 0, 14, dt);
      fillLampMat.emissiveIntensity = 0.03 + fillLamp * 7;
      fillLampLight.intensity = fillLamp * 1.6;
    }

    // --- Capper: pull the knob all the way down to press the held lid onto the can
    const press = new PressHandle(CAPPER.travel);
    let pressFired = false, lidPop = 1;

    function updateCapper(dt) {
      if (!game.own.cap) return;
      press.update(dt);
      pressMove.position.y = -Math.max(0, press.p) * CAPPER.travel;
      if (press.p > 0.96 && !pressFired) {
        pressFired = true;
        const c = canAt(ST.CAP);
        if (c && !c.capped && heldLid.visible) {
          c.capped = true;
          c.lid.visible = true;
          c.squash = 1;
          heldLid.visible = false;
          Sound.clunk();
        } else {
          Sound.clank(0.7);
        }
      }
      if (press.p < 0.5) pressFired = false;
      if (!heldLid.visible && press.p < 0.15) { heldLid.visible = true; lidPop = 0; } // next lid pops in
      if (lidPop < 1) {
        lidPop = Math.min(1, lidPop + dt / 0.3);
        heldLid.scale.setScalar(Math.max(0.01, Ease.outBack(lidPop)));
      }
    }

    // --- Labeler: hold the roll; the can turns and the label wraps on
    const labeler = { held: false, spin: 0 };
    let rustling = false;

    function updateLabeler(dt) {
      rustling = false;
      if (!game.own.label) return;
      labeler.spin = damp(labeler.spin, labeler.held ? 1 : 0, 10, dt);
      if (labeler.spin < 0.01) return;
      const turn = labeler.spin * labelRate() * Math.PI * 2 * dt;
      labelRoll.rotation.y += turn * (CAN.radius / 0.17);
      labelCrank.rotation.y += turn * (CAN.radius / 0.17);
      const c = canAt(ST.LABEL);
      if (c && !c.labeled) {
        c.labelProgress = Math.min(1, c.labelProgress + labeler.spin * labelRate() * dt);
        rustling = labeler.spin > 0.2;
        if (c.labelProgress >= 1) { c.labeled = true; Sound.click(); }
      }
    }

    // --- Stamper: one press of the button, one stamp
    const stamper = { t: -1, hit: false };

    function triggerStamp() {
      if (stamper.t >= 0) return;
      stamper.t = 0;
      stamper.hit = false;
      Sound.click();
    }

    function updateStamper(dt) {
      if (!game.own.stamp) return;
      let y = 0;
      if (stamper.t >= 0) {
        stamper.t += dt;
        const t = stamper.t;
        if (t < 0.11) y = Ease.inQuad(t / 0.11);
        else if (t < 0.2) y = 1;
        else if (t < 0.5) y = 1 - Ease.outCubic((t - 0.2) / 0.3);
        else stamper.t = -1;
        if (t >= 0.11 && !stamper.hit) {
          stamper.hit = true;
          const c = canAt(ST.STAMP);
          if (c) { c.stamped = true; c.mark.visible = true; c.squash = 0.4; Sound.thump(); }
          else Sound.clank(0.6);
        }
      }
      stampMove.position.y = -y * STAMPER.travel;
      const pressed = stamper.t >= 0 && stamper.t < 0.25;
      stampButton.position.y = damp(stampButton.position.y, stampButtonBaseY - (pressed ? 0.018 : 0), 30, dt);
    }

    // --- Crate: catches up to six cans; click it to shove it off the shelf and sell them
    const crate = {
      state: 'ready',    // 'ready' | 'shipping' | 'returning'
      t: 0,
      cans: [],
      incoming: 0,
      vx: 0,
      vy: 0,
      accepting() {
        return game.own.crate && this.state === 'ready' && this.cans.length + this.incoming < 6;
      },
      slotLocal(i, out) {
        return out.set(-0.52 + (i % 3) * 0.52, 0.03, i < 3 ? 0.26 : -0.26);
      },
      slotWorld(i, out) {
        return crateTray.localToWorld(this.slotLocal(i, out));
      },
      receive(c) {
        c.state = 'crating';
        c.slot = this.cans.length + this.incoming;
        this.incoming++;
        c.crateT = 0;
        c.crateFrom = c.group.position.clone();
      },
      land(c) {
        this.incoming--;
        crateTray.attach(c.group);
        this.slotLocal(c.slot, c.group.position);
        c.state = 'crated';
        this.cans.push(c);
        Sound.tock(0.6);
      },
      ship() {
        if (this.state !== 'ready' || this.cans.length === 0 || this.incoming > 0) return;
        let total = 0;
        for (const c of this.cans) total += canValue(c);
        earn(total * 1.6, crateTray.getWorldPosition(new THREE.Vector3()).add(_tmp.set(0, 0.7, 0)));
        this.state = 'shipping';
        this.t = 0;
        this.vx = 0;
        this.vy = 0;
        Sound.clunk();
      },
      update(dt) {
        if (this.state === 'shipping') {
          this.t += dt;
          this.vx += 3.0 * dt;                      // shove
          if (this.t > 0.35) {
            this.vy -= 9.5 * dt;                    // off the edge
            crateTray.rotation.z -= 0.9 * dt;
          }
          crateTray.position.x += this.vx * dt;
          crateTray.position.y += this.vy * dt;
          const o = 1 - Ease.inQuad(clamp01((this.t - 0.3) / 1.3));
          MAT.crate.opacity = o;
          for (const c of this.cans) c.opacity = o;
          if (this.t > 1.7) {
            for (const c of this.cans) c.dispose();
            this.cans = [];
            crateTray.position.set(CRATE_OFF, SHELF_Y, 0);
            crateTray.rotation.set(0, 0, 0);
            MAT.crate.opacity = 1;
            riseUp(crateTray, 0.2, SHELF_Y);        // a fresh crate comes up
            this.state = 'returning';
            this.t = 0;
          }
        } else if (this.state === 'returning') {
          this.t += dt;
          if (this.t > 2.1) this.state = 'ready';
        }
      },
    };

    /* =====================================================================
       13. BUILD THE WORLD (from the save, if there is one)
       ===================================================================== */

    loadGame();
    for (let i = 0; i < 5; i++) segments.push(buildSegment(i));
    const stations = [buildDispenser(), buildFiller(), buildCapper(), buildLabeler(), buildStamper()];
    const crateGroup = buildCrate();
    for (let i = 0; i < stations.length; i++) {
      const owned = i < bayCount();
      segments[i].visible = owned;
      stations[i].group.visible = owned;
    }
    crateGroup.visible = game.own.crate;
    endCapTarget = endX();
    endCap.position.x = endCapTarget;

    const chain = new PullChain(CHAIN_TOP, 1.4);
    chain.onTug = () => { Sound.click(); dispense(); };

    /* =====================================================================
       14. SHOP (icons and numbers only)
       ===================================================================== */

    const ICONS = {
      drop: '<path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10z"/>',
      gear: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
      tap: '<path d="M4 8h9a3 3 0 0 1 3 3v2"/><path d="M8 5v3M6 5h4"/><path d="M16 15.5c.9 1.2 1.6 2 1.6 2.8a1.6 1.6 0 0 1-3.2 0c0-.8.7-1.6 1.6-2.8z"/>',
      can: '<ellipse cx="12" cy="5.5" rx="5" ry="1.6"/><path d="M7 5.5v13c0 .9 2.2 1.6 5 1.6s5-.7 5-1.6v-13"/>',
      wave: '<path d="M3 8h18M3 18h18"/><path d="M3 13c2.2-3 4.3-3 6.5 0s4.3 3 6.5 0 3.3-2 5-1"/>',
      press: '<circle cx="12" cy="3.2" r="1.4"/><path d="M12 4.6v4"/><rect x="7.5" y="8.6" width="9" height="2.6" rx=".6"/><path d="M8.5 14h7v6.5h-7z"/>',
      label: '<path d="M8 4h8v16H8z"/><path d="M8 10h8M8 14.5h8"/><path d="M16 10c2 0 3 1 3 2.25S18 14.5 16 14.5"/>',
      stamp: '<path d="M9.5 3.5h5v3l-1 3h-3l-1-3z"/><path d="M6 12h12v3H6z"/><path d="M7 19h10"/>',
      six: '<rect x="3" y="5.5" width="18" height="13" rx="1"/><circle cx="7.5" cy="9.5" r="1.8"/><circle cx="12" cy="9.5" r="1.8"/><circle cx="16.5" cy="9.5" r="1.8"/><circle cx="7.5" cy="14.5" r="1.8"/><circle cx="12" cy="14.5" r="1.8"/><circle cx="16.5" cy="14.5" r="1.8"/>',
    };

    const moneyEl = document.getElementById('money');
    const moneyText = moneyEl.querySelector('span');
    const shopEl = document.getElementById('shop');
    const tiles = {};

    for (const item of SHOP) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.hidden = true;
      el.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[item.icon]}</svg><span class="c"></span>`
        + (item.max ? `<span class="p">${'<b></b>'.repeat(item.max)}</span>` : '');
      el.addEventListener('click', () => buy(item));
      el.addEventListener('animationend', () => el.classList.remove('flash'));
      shopEl.appendChild(el);
      tiles[item.id] = { el, cost: el.querySelector('.c'), pips: el.querySelectorAll('.p b') };
    }

    // A tile shows up once you can nearly afford it, and stays.
    function itemVisible(item) {
      if (ONE_TIME.has(item.id) && game.own[item.id]) return false;
      if (item.after && !game.own[item.after]) return false;
      if (game.seen[item.id]) return true;
      if (game.money >= itemCost(item) * 0.5) { game.seen[item.id] = true; return true; }
      return false;
    }

    function refreshShop() {
      for (const item of SHOP) {
        const t = tiles[item.id];
        const visible = itemVisible(item);
        if (t.el.hidden === visible) t.el.hidden = !visible;
        if (!visible) continue;
        const maxed = item.max && game.lv[item.id] >= item.max;
        const cost = itemCost(item);
        t.el.classList.toggle('ok', !maxed && game.money >= cost);
        t.el.classList.toggle('max', !!maxed);
        const text = maxed ? '' : fmt(cost);
        if (t.cost.textContent !== text) t.cost.textContent = text;
        if (item.max) t.pips.forEach((pip, i) => pip.classList.toggle('f', i < game.lv[item.id]));
      }
      const text = fmt(game.money);
      if (moneyText.textContent !== text) moneyText.textContent = text;
      if (game.seen.money) moneyEl.classList.add('on');
    }

    function buy(item) {
      if (ONE_TIME.has(item.id) ? game.own[item.id] : game.lv[item.id] >= item.max) return;
      const cost = itemCost(item);
      if (game.money < cost) return;
      game.money -= cost;
      if (ONE_TIME.has(item.id)) {
        game.own[item.id] = true;
        onStationBought(item);
      } else {
        game.lv[item.id]++;
      }
      Sound.buy();
      const el = tiles[item.id].el;
      el.classList.remove('flash');
      void el.offsetWidth; // restart the flash animation
      el.classList.add('flash');
      refreshShop();
      saveGame();
    }

    // A new station rises out of the dark and the camera drifts over to it
    function onStationBought(item) {
      if (item.station !== undefined) {
        riseUp(segments[item.station]);
        riseUp(stations[item.station].group, 0.3);
        endCapTarget = endX();
        view.tx = bayX(item.station);
      } else if (item.id === 'crate') {
        riseUp(crateGroup);
        crateTray.visible = true;
        view.tx = endX() + 0.8;
      }
      updatePanLimits();
    }

    /* =====================================================================
       15. CAMERA: pan along the line, zoom, and a little orbit
       ===================================================================== */

    const view = {
      x: 0, tx: 0,
      dist: VIEW.startDist, tdist: VIEW.startDist,
      az: VIEW.azimuth, taz: VIEW.azimuth,
      pol: VIEW.polar, tpol: VIEW.polar,
      minX: 0, maxX: 0,
    };

    function updatePanLimits() {
      view.minX = START_X + 0.3;
      view.maxX = Math.max(view.minX, endX() + (game.own.crate ? 1.6 : 0) - 0.3);
    }
    updatePanLimits();
    view.x = view.tx = clamp((START_X + endX()) / 2, view.minX, view.maxX);

    const camTarget = new THREE.Vector3();
    const worldPerPixel = () => (2 * view.dist * Math.tan(deg(camera.fov / 2))) / window.innerHeight;

    function updateCamera(dt) {
      view.tx = clamp(view.tx, view.minX, view.maxX);
      view.tdist = clamp(view.tdist, VIEW.minDist, VIEW.maxDist);
      view.taz = clamp(view.taz, VIEW.azimuth - VIEW.orbitSide, VIEW.azimuth + VIEW.orbitSide);
      view.tpol = clamp(view.tpol, VIEW.polar - VIEW.orbitUp, VIEW.polar + VIEW.orbitUp);
      view.x = damp(view.x, view.tx, 7, dt);
      view.dist = damp(view.dist, view.tdist, 7, dt);
      view.az = damp(view.az, view.taz, 8, dt);
      view.pol = damp(view.pol, view.tpol, 8, dt);

      const zoomT = (view.dist - VIEW.minDist) / (VIEW.maxDist - VIEW.minDist);
      camTarget.set(view.x, lerp(1.75, 1.25, zoomT), lerp(0, 0.2, zoomT));
      camera.position.setFromSphericalCoords(view.dist, view.pol, view.az).add(camTarget);
      camera.lookAt(camTarget);

      // the spotlight, its beam and the rim light follow along
      keyLight.target.position.set(view.x, 1.5, 0);
      keyLight.position.copy(keyLight.target.position).add(KEY_OFFSET);
      rimLight.target.position.set(view.x, 1.4, 0);
      rimLight.position.copy(rimLight.target.position).add(RIM_OFFSET);
      beam.position.copy(keyLight.position);
      scene.fog.density = FOG_DENSITY * (FOG_REF / view.dist);
    }

    /* =====================================================================
       16. INPUT
       Click and drag the machine's parts. Drag empty space to slide along
       the line; right-drag to tilt; scroll or pinch to zoom.
       ===================================================================== */

    const canvas = renderer.domElement;
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const interactives = [];
    let runPressed = false;

    function addControl(hits, control) {
      for (const hit of [].concat(hits)) {
        hit.userData.control = control;
        interactives.push(hit);
      }
    }

    addControl(chain.hitArea, {
      cursor: 'grab', enabled: () => true,
      down: (ray) => chain.beginDrag(ray), move: (ray) => chain.drag(ray), up: () => chain.endDrag(),
    });
    addControl(stations[ST.DROP].runHit, {
      cursor: 'pointer', enabled: () => true,
      down: () => { runPressed = true; Sound.click(); startIndex(); }, up: () => { runPressed = false; },
    });
    addControl(stations[ST.FILL].valveHit, {
      cursor: 'pointer', enabled: () => true,
      down: () => { valve.open = true; Sound.click(); }, up: () => closeValve(),
    });
    addControl(stations[ST.CAP].knobHit, {
      cursor: 'grab', enabled: () => game.own.cap,
      down: (ray) => press.beginDrag(ray, stations[ST.CAP].knobHit.getWorldPosition(new THREE.Vector3())),
      move: (ray) => press.drag(ray), up: () => press.endDrag(),
    });
    addControl(stations[ST.LABEL].hits, {
      cursor: 'pointer', enabled: () => game.own.label,
      down: () => { labeler.held = true; }, up: () => { labeler.held = false; },
    });
    addControl(stations[ST.STAMP].hits, {
      cursor: 'pointer', enabled: () => game.own.stamp,
      down: () => triggerStamp(),
    });
    addControl(crateHit, {
      cursor: 'pointer',
      enabled: () => game.own.crate && crate.state === 'ready' && crate.cans.length > 0 && crate.incoming === 0,
      down: () => crate.ship(),
    });

    function setRay(e) {
      const rect = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
    }

    function pickControl(e) {
      setRay(e);
      for (const hit of raycaster.intersectObjects(interactives, false)) {
        const control = hit.object.userData.control;
        if (control.enabled()) return control;
      }
      return null;
    }

    let drag = null; // what the pointer is currently doing

    canvas.addEventListener('pointerdown', (e) => {
      Sound.unlock();
      if (drag) return;
      const control = e.button === 0 ? pickControl(e) : null;
      canvas.setPointerCapture(e.pointerId);
      if (control) {
        drag = { kind: 'control', control, id: e.pointerId };
        control.down(raycaster.ray);
        if (control.cursor === 'grab') canvas.style.cursor = 'grabbing';
      } else {
        drag = { kind: e.button === 2 || e.shiftKey ? 'orbit' : 'pan', id: e.pointerId, x: e.clientX, y: e.clientY };
        canvas.style.cursor = 'grabbing';
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (drag && e.pointerId === drag.id) {
        if (drag.kind === 'control') {
          if (drag.control.move) { setRay(e); drag.control.move(raycaster.ray); }
        } else {
          const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
          drag.x = e.clientX;
          drag.y = e.clientY;
          if (drag.kind === 'pan') view.tx -= (dx * worldPerPixel()) / Math.cos(view.az);
          else { view.taz -= dx * 0.004; view.tpol -= dy * 0.003; }
        }
        return;
      }
      if (e.pointerType === 'mouse' && !drag) {
        const control = pickControl(e);
        canvas.style.cursor = control ? control.cursor : '';
      }
    });

    function endDrag(e) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      if (drag.kind === 'control' && drag.control.up) drag.control.up();
      if (e && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      drag = null;
      canvas.style.cursor = '';
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('blur', () => { endDrag(null); runPressed = false; });
    window.addEventListener('pointerup', () => Sound.unlock());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const scale = e.deltaMode === 1 ? 16 : 1;
      const dx = e.deltaX * scale, dy = e.deltaY * scale;
      if (!e.ctrlKey && Math.abs(dx) > Math.abs(dy)) view.tx += dx * worldPerPixel();   // sideways swipe
      else if (e.shiftKey) view.tx += dy * worldPerPixel();                             // shift + wheel
      else view.tdist *= Math.exp(dy * (e.ctrlKey ? 0.01 : 0.0012));                    // wheel / pinch
    }, { passive: false });

    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      Sound.unlock();
      keys.add(e.code);
      if (e.code === 'Space') {
        e.preventDefault();
        if (!e.repeat) { runPressed = true; Sound.click(); startIndex(); }
      }
    });
    window.addEventListener('keyup', (e) => {
      keys.delete(e.code);
      if (e.code === 'Space') runPressed = false;
    });

    function handleKeys(dt) {
      const right = keys.has('ArrowRight') || keys.has('KeyD');
      const left = keys.has('ArrowLeft') || keys.has('KeyA');
      if (right !== left) view.tx += (right ? 1 : -1) * dt * 0.5 * view.dist;
      if (keys.has('Equal') || keys.has('NumpadAdd')) view.tdist *= Math.exp(-dt * 1.5);
      if (keys.has('Minus') || keys.has('NumpadSubtract')) view.tdist *= Math.exp(dt * 1.5);
    }

    /* =====================================================================
       17. RESIZE, SAVE, AND THE FRAME LOOP
       ===================================================================== */

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      dust.material.uniforms.uScale.value = window.innerHeight * pixelRatio * 0.5;
    }
    window.addEventListener('resize', onResize);
    onResize();

    setInterval(saveGame, 5000);
    window.addEventListener('beforeunload', saveGame);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

    const clock = new THREE.Clock();
    let shopTimer = 0, runLamp = 0;
    refreshShop();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 1 / 20);
      const time = clock.elapsedTime;

      handleKeys(dt);
      updateCamera(dt);
      updateRisers(dt);
      endCap.position.x = damp(endCap.position.x, endCapTarget, 3, dt);

      chain.update(dt, time);
      updateBelt(dt);
      updateFiller(dt, time);
      updateCapper(dt);
      updateLabeler(dt);
      updateStamper(dt);
      crate.update(dt);
      for (const can of [...cans]) can.update(dt);
      splash.update(dt);
      dust.update(dt, time, view.x, view.dist);

      // push button and its lamp
      runButton.position.y = damp(runButton.position.y, runButtonBaseY - (runPressed ? 0.018 : 0), 30, dt);
      runLamp = damp(runLamp, belt.indexing ? 1 : 0, 14, dt);
      runLampMat.emissiveIntensity = 0.05 + runLamp * 3;
      powerLedMat.emissiveIntensity = 2.0 + Math.sin(time * 2.2) * 0.25;

      const fillCan = canAt(ST.FILL);
      const topSpeed = (BAY / indexTime()) * (Math.PI / 2);
      Sound.update(clamp01(belt.speed / topSpeed), stream.hitting, fillCan ? fillCan.fill : 0, rustling);

      shopTimer -= dt;
      if (shopTimer <= 0) { shopTimer = 0.15; refreshShop(); }

      composer.render();
      window.__dioramaStarted = true;
    });
  </script>
</body>
</html>
